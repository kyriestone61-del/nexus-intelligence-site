<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Manage Relystra Fit Call | Relystra</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/simple-site.css"><link rel="stylesheet" href="/mobile-ux.css"><style>.manage{max-width:760px;margin:auto}.manage-card{padding:26px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025)}.slot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}.slot{border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(255,255,255,.02);color:var(--text);cursor:pointer}.slot.active{border-color:rgba(101,216,255,.5);background:rgba(101,216,255,.08)}@media(max-width:600px){.slot-list{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/relystra-brand.css"><link rel="manifest" href="/site.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="icon" href="/assets/relystra-mark.svg" type="image/svg+xml"><meta name="robots" content="noindex,nofollow"><meta name="relystra-stage" content="provisional-owner-risk-accepted"></head><body><div class="rebrand-transition" role="status"><strong>Relystra</strong>, formerly Nexus Intelligence. <span>Same team. Same practical, measurable approach.</span></div><header class="site-header"><div class="wrap"><nav><a class="brand" href="/"><img class="brand-mark" src="/assets/relystra-mark.svg" alt=""><span>Relystra</span></a></nav></div></header><main><section><div class="wrap manage"><div id="card" class="manage-card"><div class="kicker">Fit call</div><h1 style="font-size:38px">Manage your booking.</h1><p class="muted">Loading booking details…</p></div></div></section></main><script>(async function(){const card=document.getElementById('card'),q=new URLSearchParams(location.search),mode=q.get('mode'),token=q.get('token'),tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/New_York';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!['cancel','reschedule'].includes(mode)){card.innerHTML='<h1>Invalid booking link.</h1><p>This link is incomplete or expired.</p>';return}async function details(){const r=await fetch(`/api/booking-manage?mode=${encodeURIComponent(mode)}&token=${encodeURIComponent(token)}`),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Booking not found');return d.booking}try{const b=await details();if(b.status==='cancelled'||b.cancelled_at){card.innerHTML='<div class="kicker">Cancelled</div><h1>Your fit call is cancelled.</h1><p>No further action is required.</p>';return}const current=new Date(b.start).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});if(mode==='cancel'){card.innerHTML=`<div class="kicker">Cancel fit call</div><h1>Cancel this booking?</h1><p><b>${esc(current)}</b></p><p class="muted">The calendar event will be cancelled and attendees will receive the update.</p><div class="actions"><button id="cancel" class="btn primary" type="button">Confirm cancellation</button><a class="btn secondary" href="/">Keep booking</a></div><p id="msg" class="small"></p>`;document.getElementById('cancel').onclick=async()=>{const btn=document.getElementById('cancel');btn.disabled=true;const r=await fetch('/api/booking-manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'cancel',token})}),d=await r.json();if(r.ok&&d.ok)card.innerHTML='<div class="kicker">Cancelled</div><h1>Your fit call is cancelled.</h1><p>The calendar update has been sent.</p>';else{document.getElementById('msg').textContent=d.error||'Cancellation failed.';btn.disabled=false}};return}card.innerHTML=`<div class="kicker">Reschedule fit call</div><h1>Choose a new time.</h1><p>Current: <b>${esc(current)}</b></p><div id="slots"><p class="muted">Loading live availability…</p></div><div class="actions"><button id="save" class="btn primary" disabled type="button">Confirm new time</button></div><p id="msg" class="small"></p>`;const r=await fetch('/api/booking-availability'),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Availability unavailable');let selected=null;const slots=(d.slots||[]).slice(0,18);document.getElementById('slots').innerHTML=`<div class="slot-list">${slots.map(x=>`<button class="slot" data-start="${esc(x.start)}" type="button"><b>${esc(new Date(x.start).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</b></button>`).join('')}</div>`;document.querySelectorAll('.slot').forEach(btn=>btn.onclick=()=>{selected=slots.find(x=>x.start===btn.dataset.start);document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('active',x===btn));document.getElementById('save').disabled=!selected});document.getElementById('save').onclick=async()=>{if(!selected)return;const btn=document.getElementById('save');btn.disabled=true;const rr=await fetch('/api/booking-manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'reschedule',token,start:selected.start,end:selected.end,timezone:tz})}),out=await rr.json();if(rr.ok&&out.ok)card.innerHTML=`<div class="kicker">Rescheduled</div><h1>Your new time is confirmed.</h1><p><b>${esc(new Date(out.start).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}))}</b></p><p>The calendar invitation has been updated.</p>`;else{document.getElementById('msg').textContent=out.error||'Reschedule failed.';btn.disabled=false}}}catch(e){card.innerHTML=`<h1>Booking unavailable.</h1><p>${esc(e.message||'This booking could not be loaded.')}</p>`}})();</script></body></html>
