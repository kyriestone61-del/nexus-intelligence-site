name: Nexus Diagnosis Step 4 QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnosis-step4-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --input-type=module --check < portal-diagnosis-output-hub.js
          node --input-type=module --check < portal-diagnosis-approval-ux.js
          node --input-type=module --check < portal-resolution-plan.js
          node --input-type=module --check < portal-resolution-inline-approval-bridge.js
      - name: Diagnosis output drill-down contract
        run: |
          set -euo pipefail
          grep -Fq "data-output-kind" portal-diagnosis-output-hub.js
          grep -Fq "Continue to Step 4" portal-diagnosis-output-hub.js
          grep -Fq "Send to client Inbox" portal-diagnosis-output-hub.js
          grep -Fq "data-complete-task" portal-diagnosis-output-hub.js
          grep -Fq "Proceed with this" portal-diagnosis-output-hub.js
          grep -Fq "data-document-owner" portal-diagnosis-output-hub.js
          grep -Fq "NexusRevenueEngine" portal-diagnosis-output-hub.js
          grep -Fq "portal-diagnosis-output-hub.js?v=" portal-diagnosis-approval-ux.js
          grep -Fq "portal-resolution-plan.js?v=" portal-diagnosis-approval-ux.js
          grep -Fq "nexus_get_resolution_plan" portal-resolution-plan.js
          # Browser code must use the Phase Zero commercial-close wrapper. The legacy
          # planner remains server-side inside that wrapper for backward compatibility.
          grep -Fq "nexus_phase_zero_confirm_resolution_plan" portal-resolution-plan.js
          if grep -Fq "sb.rpc('nexus_confirm_resolution_plan'" portal-resolution-plan.js; then
            echo 'Direct browser invocation of nexus_confirm_resolution_plan bypasses the Phase Zero commercial gate.' >&2
            exit 1
          fi
          grep -Fq "public.nexus_confirm_resolution_plan(p_run_id)" supabase/migrations/20260905_relystra_phase_zero_client_lifecycle.sql
          grep -Fq "implementation_released',false" supabase/migrations/20260905_relystra_phase_zero_client_lifecycle.sql
      - name: Mobile contract
        run: |
          set -euo pipefail
          grep -Fq "@media(max-width:600px)" portal-diagnosis-output-hub.css
          grep -Fq ".output-tabs" portal-diagnosis-output-hub.css
          grep -Fq ".diagnosis-step4-guide" portal-diagnosis-output-hub.css