name: Human OS Tutor Response Contract
on:
  pull_request:
    paths:
      - 'supabase/functions/hlo-tutor-stream/**'
      - 'supabase/functions/hlo-eval-batch/**'
      - 'tests/human-os-response-contract.test.mjs'
      - '.github/workflows/human-os-tutor-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  response-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/human-os-response-contract.test.mjs
