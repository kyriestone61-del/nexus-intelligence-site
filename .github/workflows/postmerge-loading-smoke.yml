name: Nexus Post-Merge Loading Verification

on:
  push:
    branches:
      - qa/postmerge-loading-20260830
    paths:
      - '.github/workflows/postmerge-loading-smoke.yml'

permissions:
  contents: read

jobs:
  verify-production-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_ORIGIN: https://nexus-intelligence-site.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production HTTP and asset verification
        run: |
          set -euo pipefail
          for path in / /services /book /portal /portal-app.js /portal-diagnosis-override.js /portal-diagnosis-v2.js /portal-admin-journey.js; do
            url="${PROD_ORIGIN}${path}"
            echo "=== $url ==="
            metrics=$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -sS -o /tmp/body -w 'status=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}' "$url")
            echo "$metrics"
            code=$(printf '%s' "$metrics" | sed -n 's/.*status=\([0-9][0-9][0-9]\).*/\1/p')
            test -n "$code"
            test "$code" -lt 500
          done
          curl -fsS "${PROD_ORIGIN}/portal-app.js" | grep -Fq 'portal-diagnosis-override.js?v=20260830-2'
          curl -fsS "${PROD_ORIGIN}/portal-diagnosis-override.js" | grep -Fq 'observer?.disconnect()'
          curl -fsS "${PROD_ORIGIN}/portal-admin-journey.js" | grep -Fq 'nexus:diagnosis-changed'

      - name: Install browser harness
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Production browser and starvation regression
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            let failed=false;
            try{
              for(const path of ['/','/services','/book','/portal']){
                const page=await browser.newPage();
                const pageErrors=[],consoleErrors=[],requestFailures=[],badResponses=[];
                page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
                page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                page.on('requestfailed',r=>requestFailures.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
                page.on('response',r=>{if(r.status()>=400&&r.url().startsWith(process.env.PROD_ORIGIN))badResponses.push(`${r.status()} ${r.url()}`)});
                let response;
                try{
                  response=await page.goto(process.env.PROD_ORIGIN+path,{waitUntil:'domcontentloaded',timeout:30000});
                  await new Promise(r=>setTimeout(r,2500));
                  const selector=path==='/portal'?'#signInForm':'h1';
                  await page.waitForSelector(selector,{timeout:10000});
                }catch(e){console.error(`Render failure ${path}`,e);failed=true}
                const state=await page.evaluate(()=>({readyState:document.readyState,bodyChars:document.body?.innerText?.length||0})).catch(()=>({}));
                console.log(JSON.stringify({path,status:response?.status?.(),state,pageErrors,consoleErrors,requestFailures,badResponses}));
                const criticalConsole=consoleErrors.filter(x=>!/favicon|analytics|Failed to load resource.*404/i.test(x));
                const criticalBad=badResponses.filter(x=>!/favicon/i.test(x));
                if(!response||response.status()>=500||(state.bodyChars||0)<80||pageErrors.length||criticalConsole.length||criticalBad.length)failed=true;
                await page.close();
              }

              const page=await browser.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e)));
              await page.goto(process.env.PROD_ORIGIN+'/portal',{waitUntil:'networkidle2',timeout:30000});
              const inject=page.evaluate(()=>{
                const card=document.createElement('article');
                card.className='diagnosis-run-card';
                card.innerHTML='<span class="diagnosis-status ready_for_review">ready for review</span><div class="diagnosis-run-actions"><select class="diagnosis-status-select" data-id="synthetic-run"><option value="ready_for_review" selected>Ready</option></select><button class="copy-agent-packet" data-id="synthetic-run">Copy</button></div>';
                document.body.appendChild(card);
                return 'injected';
              });
              const injected=await Promise.race([inject,new Promise(r=>setTimeout(()=>r('timeout'),2500))]);
              const probe=page.evaluate(()=>new Promise(resolve=>setTimeout(()=>resolve({ok:true,action:document.querySelector('.diagnosis-secure-action')?.textContent?.trim()||''}),500)));
              const responsiveness=await Promise.race([probe,new Promise(r=>setTimeout(()=>r({ok:false,reason:'main-thread-starvation'}),3000))]);
              console.log('STARVATION_PROBE',JSON.stringify({injected,responsiveness,errors}));
              if(injected==='timeout'||!responsiveness.ok||errors.length)failed=true;
              await page.close();
            }finally{await browser.close()}
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
