name: Nexus Task Projection QAQC

on:
  pull_request:
    paths:
      - 'portal-client.js'
      - 'core/task-projection.js'
      - 'tests/task-projection-qaqc.mjs'
      - '.github/workflows/task-projection-qaqc.yml'
  push:
    branches: [main]
    paths:
      - 'portal-client.js'
      - 'core/task-projection.js'
      - 'tests/task-projection-qaqc.mjs'
      - '.github/workflows/task-projection-qaqc.yml'

permissions:
  contents: read

jobs:
  task-projection-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < core/task-projection.js
          node --input-type=module --check < portal-client.js
          node --check tests/task-projection-qaqc.mjs
      - name: Active-engagement task projection contract
        run: node tests/task-projection-qaqc.mjs
      - name: No privileged browser credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -niE 'service[_-]?role|SUPABASE_SERVICE|RESEND_API_KEY|TWILIO_AUTH_TOKEN|SECRET_KEY' core/task-projection.js; then
            echo 'Privileged credential reference found in task projection.' >&2
            exit 1
          fi
