name: Relystra Auth Email Resilience QA

on:
  pull_request:
    paths:
      - 'functions/api/auth-email.js'
      - 'portal-auth.js'
      - 'supabase/functions/nexus-email-worker/index.ts'
      - 'supabase/functions/nexus-email-worker/auth-recovery.ts'
      - 'supabase/migrations/*platform_auth_email_resilience.sql'
      - 'supabase/migrations/*relystra_queue_auth_recovery.sql'
      - '.github/workflows/auth-email-resilience-qa.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/auth-email.js'
      - 'portal-auth.js'
      - 'supabase/functions/nexus-email-worker/index.ts'
      - 'supabase/functions/nexus-email-worker/auth-recovery.ts'
      - 'supabase/migrations/*platform_auth_email_resilience.sql'
      - 'supabase/migrations/*relystra_queue_auth_recovery.sql'
      - '.github/workflows/auth-email-resilience-qa.yml'

permissions:
  contents: read

jobs:
  auth-email-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and same-origin gateway assertions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < functions/api/auth-email.js
          node --input-type=module --check < portal-auth.js
          grep -Fq "fetch('/api/auth-email'" portal-auth.js
          grep -Fq "operation:'recovery'" portal-auth.js
          ! grep -Fq 'resetPasswordForEmail' portal-auth.js
          grep -Fq '/rest/v1/rpc/nexus_queue_auth_recovery' functions/api/auth-email.js
          grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' functions/api/auth-email.js
          ! grep -Fq 'RESEND_API_KEY' functions/api/auth-email.js
          ! grep -Fq '/auth/v1/admin/generate_link' functions/api/auth-email.js
          if grep -Eiq 'service[_-]?role|RESEND_API_KEY|EMAIL_DISPATCH_SECRET' portal-auth.js; then
            echo 'Privileged auth-email credential reference found in browser code.' >&2
            exit 1
          fi
      - name: Queue, worker and no-token-persistence assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nexus_queue_auth_recovery' supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq "message_kind,subject,body_text" supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq "'auth_recovery'" supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq "token_persisted',false" supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq 'pg_advisory_xact_lock' supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq 'grant execute on function public.nexus_queue_auth_recovery' supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq 'prepareAuthRecovery' supabase/functions/nexus-email-worker/index.ts
          grep -Fq 'Idempotency-Key' supabase/functions/nexus-email-worker/index.ts
          grep -Fq '/auth/v1/admin/generate_link' supabase/functions/nexus-email-worker/auth-recovery.ts
          grep -Fq 'provider_accepted' supabase/functions/nexus-email-worker/auth-recovery.ts
          grep -Fq 'token_persisted:false' supabase/functions/nexus-email-worker/auth-recovery.ts
          grep -Fq "x-nexus-worker-token" supabase/functions/nexus-email-worker/index.ts
          grep -Fq "await digest(workerToken)!==cfg.secret_hash" supabase/functions/nexus-email-worker/index.ts
          grep -Fq 'Raw email addresses, passwords, reset links' supabase/migrations/20260905_platform_auth_email_resilience.sql
          grep -Fq 'enable row level security' supabase/migrations/20260905_platform_auth_email_resilience.sql
          grep -Fq 'revoke all on table public.platform_auth_email_events from anon, authenticated' supabase/migrations/20260905_platform_auth_email_resilience.sql
          if grep -Eiq 'action_link|token_hash|access_token|refresh_token' supabase/migrations/20260905_relystra_queue_auth_recovery.sql; then
            echo 'Recovery token/link persistence marker found in queue migration.' >&2
            exit 1
          fi
      - name: Enumeration protection assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "If that email matches a Relystra account" functions/api/auth-email.js
          grep -Fq "not_found', true" supabase/migrations/20260905_relystra_queue_auth_recovery.sql
          grep -Fq "suppressed', true" supabase/migrations/20260905_relystra_queue_auth_recovery.sql
