name: Nexus Mobile Perspectives QA

on:
  pull_request:
    paths:
      - 'portal-client.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'perspective-switcher.css'
      - 'portal-mobile-hardening.css'
      - '.github/workflows/mobile-perspectives-qaqc.yml'
  push:
    branches: [main]
    paths:
      - 'portal-client.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'perspective-switcher.css'
      - 'portal-mobile-hardening.css'
      - '.github/workflows/mobile-perspectives-qaqc.yml'

jobs:
  mobile-perspectives-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portal JavaScript syntax
        run: |
          node --input-type=module --check < portal-client.js
          node --input-type=module --check < portal-client-shell-v2.js
      - name: Canonical administrator recovery contract
        run: |
          grep -q "sb.rpc('nexus_is_platform_admin')" portal-client.js
          grep -q "stateController.patch({admin},'auth:authorization')" portal-client.js
          grep -q "compatibility fallback" portal-client.js
          grep -q "nexus_platform_admins" portal-client.js
      - name: Existing portal mobile hardening is actually loaded
        run: |
          grep -q "@import url('/portal-mobile-hardening.css" perspective-switcher.css
          grep -q "@media(max-width:760px)" portal-mobile-hardening.css
          grep -q "diagnosis-review-card" portal-mobile-hardening.css
      - name: Simplified client mobile UX contract
        run: |
          grep -Fq "['home','Home']" portal-client-shell-v2.js
          grep -Fq "['tasks','Tasks']" portal-client-shell-v2.js
          grep -Fq "['files','Files']" portal-client-shell-v2.js
          grep -Fq "['reports','Reports']" portal-client-shell-v2.js
          grep -Fq '@media(max-width:760px)' portal-client-shell-simple.css
          grep -Fq '@media(max-width:390px)' portal-client-shell-simple.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' portal-client-shell-simple.css
          grep -Fq 'min-height:48px' portal-client-shell-simple.css
          grep -Fq 'font-size:16px!important' portal-client-shell-simple.css
          grep -Fq 'safe-area-inset-bottom' portal-client-shell-v2.css
      - name: Admin mobile UX contract
        run: |
          grep -q "portal-body:not(.portal-client-mode) .journey-primary" perspective-switcher.css
          grep -q "portal-body .topbar #nexusPerspectiveSwitcher" perspective-switcher.css
          grep -q "data-diagnosis-action" perspective-switcher.css
      - name: Operations mobile UX contract
        run: |
          grep -q "ops-native-topbar" perspective-switcher.css
          grep -q "ops-native-nav" perspective-switcher.css
          grep -q "ops-table-wrap" perspective-switcher.css
          grep -q "ops-modal-card" perspective-switcher.css
          grep -q "font-size:16px" perspective-switcher.css
      - name: Three-perspective navigation remains intact
        run: |
          grep -q "Admin" portal-perspective-switcher.js
          grep -q "Operations" portal-perspective-switcher.js
          grep -q "Client View" portal-perspective-switcher.js
          grep -q "Admin" operations-perspective-switcher.js
          grep -q "Client View" operations-perspective-switcher.js
