name: Nexus Admin Journey QA

on:
  pull_request:
    paths:
      - 'portal-admin-journey.js'
      - 'portal-admin-journey-router.js'
      - 'portal-admin-journey.css'
      - 'portal-admin-intake.js'
      - 'portal-discovery-capture.js'
      - 'portal-discovery-capture.css'
      - 'portal-diagnosis-controller-v2.js'
      - 'portal-diagnosis-execution-ux.js'
      - 'portal-diagnosis-v2.js'
      - 'portal-diagnosis-manual-fallback.js'
      - 'portal-diagnosis-review-ux.js'
      - 'portal-diagnosis-release-queue.js'
      - 'portal-app.js'
      - 'functions/portal.js'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-journey-qa.yml'

permissions:
  contents: read

jobs:
  admin-journey-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-admin-journey.js
          node --input-type=module --check < portal-admin-journey-router.js
          node --input-type=module --check < portal-admin-intake.js
          node --input-type=module --check < portal-discovery-capture.js
          node --input-type=module --check < portal-diagnosis-controller-v2.js
          node --input-type=module --check < portal-diagnosis-execution-ux.js
          node --input-type=module --check < portal-diagnosis-v2.js
          node --input-type=module --check < portal-diagnosis-manual-fallback.js
          node --input-type=module --check < portal-diagnosis-review-ux.js
          node --input-type=module --check < portal-diagnosis-release-queue.js
          node --input-type=module --check < portal-app.js
          node --check functions/portal.js
      - name: Six-stage workflow assertions
        run: |
          set -euo pipefail
          grep -Fq "title:'Set Up Client'" portal-admin-journey.js
          grep -Fq "title:'Discovery & Diagnosis'" portal-admin-journey.js
          grep -Fq "title:'Agree on the Plan'" portal-admin-journey.js
          grep -Fq "title:'Build, Test & Launch'" portal-admin-journey.js
          grep -Fq "title:'Train & Handoff'" portal-admin-journey.js
          grep -Fq "title:'Measure, Optimize & Complete'" portal-admin-journey.js
          ! grep -Fq "title:'Collect Information'" portal-admin-journey.js
          ! grep -Fq "title:'Diagnose'" portal-admin-journey.js
          grep -Fq 'Step ${current.n} of ${STAGES.length}' portal-admin-journey.js
          grep -Fq 'Your next move' portal-admin-journey.js
          grep -Fq 'Client Journey' portal-admin-journey.js
          grep -Fq 'Tools & records' portal-admin-journey.js
          grep -Fq 'ready_to_finish' portal-admin-journey.js
      - name: Unified Step 2 and diagnosis gate assertions
        run: |
          set -euo pipefail
          ! grep -Fq "package:'client_discovery'" portal-admin-journey.js
          ! grep -Fq 'Send Client Checklist (optional)' portal-admin-journey.js
          grep -Fq 'diagnosisApproved' portal-admin-journey.js
          grep -Fq 'analysis_result' portal-admin-journey.js
          grep -Fq 'ready_for_review' portal-admin-journey.js
          grep -Fq 'nexus:diagnosis-changed' portal-admin-journey.js
          grep -Fq 'Build the evidence-backed diagnosis' portal-admin-journey.js
          grep -Fq 'Discovery & Diagnosis' portal-admin-intake.js
          grep -Fq 'Analyze Missing Information' portal-admin-intake.js
          grep -Fq 'Review Missing Information' portal-admin-intake.js
          grep -Fq 'nexus_save_discovery_admin_context' portal-admin-intake.js
          grep -Fq 'Run Diagnosis' portal-admin-intake.js
          grep -Fq 'Approve Diagnosis' portal-admin-intake.js
          grep -Fq 'diagnosisJourneyButton' portal-diagnosis-controller-v2.js
          grep -Fq 'Step\s*2\s*of\s*6' portal-diagnosis-controller-v2.js
          grep -Fq 'Resolve Diagnosis Issue' portal-diagnosis-controller-v2.js
          grep -Fq "sb.functions.invoke('nexus-diagnosis-execute'" portal-diagnosis-controller-v2.js
          grep -Fq 'supporting_document_ids:docs.map' portal-diagnosis-controller-v2.js
          grep -Fq 'nexus_approve_diagnosis' portal-diagnosis-v2.js
          grep -Fq 'nexus_release_client_task' portal-diagnosis-release-queue.js
          grep -Fq 'Finish Step 2 with ChatGPT' portal-diagnosis-manual-fallback.js
          grep -Fq "package:'solution_design'" portal-admin-journey.js
          grep -Fq "package:'implementation_launch'" portal-admin-journey.js
          grep -Fq "package:'training_handoff'" portal-admin-journey.js
          grep -Fq "package:'monthly_optimization'" portal-admin-journey.js
          grep -Fq 'nexus_assign_action_package' portal-admin-journey.js
          grep -Fq "status:'complete'" portal-admin-journey.js
          grep -Fq 'Mark Engagement Complete' portal-admin-journey.js
      - name: Client selection and Step 2 routing assertions
        run: |
          set -euo pipefail
          grep -Fq '.open-client' portal-admin-journey-router.js
          grep -Fq '.journey-primary' portal-admin-journey-router.js
          grep -Fq 'portal-admin-journey-router.js' portal-app.js
          grep -Fq "section.id='section-intake'" portal-admin-intake.js
          grep -Fq 'openIntake' portal-diagnosis-controller-v2.js
          grep -Fq "==='Discovery & Diagnosis'" portal-diagnosis-controller-v2.js
          ! grep -Fq 'syncTranscriptSelection' portal-diagnosis-controller-v2.js
          ! grep -Fq 'resolveTranscriptId' portal-diagnosis-controller-v2.js
      - name: Runtime reset scope assertion
        run: |
          set -euo pipefail
          head_ref='${{ github.head_ref }}'
          if [[ "$head_ref" == fix/portal-hard-reset-* || "$head_ref" == stabilize/portal-runtime-reset* ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
            echo "$changed"
            forbidden="$(echo "$changed" | grep -E '^(supabase/|migrations/|schema/|database/|.*\.sql$)' || true)"
            extra_functions="$(echo "$changed" | grep '^functions/' | grep -v '^functions/portal.js$' || true)"
            if [ -n "$forbidden" ] || [ -n "$extra_functions" ]; then
              echo 'Portal reset branches may change browser portal files and functions/portal.js only.' >&2
              exit 1
            fi
          else
            echo "Not a portal-reset branch; database/security changes are governed by their dedicated QA gates."
          fi
      - name: Browser security assertion
        run: |
          set -euo pipefail
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY|AI_GATEWAY_API_KEY' portal-admin-journey.js portal-admin-journey-router.js portal-admin-journey.css portal-admin-intake.js portal-discovery-capture.js portal-diagnosis-controller-v2.js portal-diagnosis-execution-ux.js portal-diagnosis-v2.js portal-diagnosis-manual-fallback.js portal-diagnosis-release-queue.js; then
            echo 'Privileged credential reference found in browser-delivered admin journey.' >&2
            exit 1
          fi
      - name: Responsive and deterministic loader assertions
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:900px)' portal-admin-journey.css
          grep -Fq 'portal-admin-journey.css' portal-app.js
          grep -Fq 'portal-admin-journey.js' portal-app.js
          grep -Fq 'portal-diagnosis-controller-v2.js' portal-app.js
          grep -Fq 'portal-diagnosis-execution-ux.js' portal-app.js
          grep -Fq 'portal-diagnosis-release-queue.js' portal-app.js
          grep -Fq 'portal-diagnosis-v2.js' portal-app.js
          grep -Fq 'portal-diagnosis-manual-fallback.js' portal-app.js
          grep -Fq 'nexus-runtime-booting' portal-app.js
          grep -Fq "const asset=path=>\`/" portal-app.js
          grep -Fq 'exact code packaged in this Cloudflare deployment' functions/portal.js
          if grep -Fq 'portal-diagnosis-override.js' portal-app.js || grep -Fq 'portal-diagnosis-state-labels.js' portal-app.js || grep -Fq 'portal-journey-reliability.js' portal-app.js || grep -Fq 'portal-launch-control.js' portal-app.js; then
            echo 'Legacy competing portal runtime modules must not load.' >&2
            exit 1
          fi
          if grep -Fq 'portal-diagnosis-result-capture.js' portal-app.js; then
            echo 'Retired diagnosis result-capture module must not be loaded.' >&2
            exit 1
          fi
