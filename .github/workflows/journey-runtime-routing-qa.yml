name: Nexus Client Journey Runtime QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-admin-journey.js'
      - 'portal-admin-intake.js'
      - 'portal-journey-reliability.js'
      - 'portal-diagnosis-v2.js'
      - 'portal-diagnosis-manual-fallback.js'
      - 'portal-journey-task-guard.js'
      - '.github/workflows/journey-runtime-routing-qa.yml'

permissions:
  contents: read

jobs:
  journey-runtime-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-admin-journey.js
          node --input-type=module --check < portal-admin-intake.js
          node --input-type=module --check < portal-journey-reliability.js
          node --input-type=module --check < portal-diagnosis-v2.js
          node --input-type=module --check < portal-diagnosis-manual-fallback.js
          node --input-type=module --check < portal-journey-task-guard.js
      - name: Step 2 and Step 3 routing contract
        run: |
          set -euo pipefail
          grep -Fq "key:'discovery'" portal-admin-journey.js
          grep -Fq "key:'diagnosis'" portal-admin-journey.js
          grep -Fq "data-open=\"intake\"" portal-admin-journey.js
          grep -Fq "section.id='section-intake'" portal-admin-intake.js
          grep -Fq "clickTargetsIntake" portal-journey-reliability.js
          grep -Fq "requestAdminIntakeReconcile" portal-journey-reliability.js
          grep -Fq "activateSection('intake')" portal-journey-reliability.js
      - name: Diagnosis provider fallback contract
        run: |
          set -euo pipefail
          grep -Fq 'AI_GATEWAY_NOT_CONFIGURED' portal-diagnosis-manual-fallback.js
          grep -Fq 'Finish Step 3 with ChatGPT' portal-diagnosis-manual-fallback.js
          grep -Fq 'Copy diagnosis prompt' portal-diagnosis-manual-fallback.js
          grep -Fq "status:'ready_for_review'" portal-diagnosis-manual-fallback.js
          grep -Fq 'nexus:diagnosis-changed' portal-diagnosis-manual-fallback.js
          grep -Fq 'nexus_approve_diagnosis' portal-diagnosis-v2.js
      - name: Steps 4 through 7 package contract
        run: |
          set -euo pipefail
          grep -Fq "package:'solution_design'" portal-admin-journey.js
          grep -Fq "package:'implementation_launch'" portal-admin-journey.js
          grep -Fq "package:'training_handoff'" portal-admin-journey.js
          grep -Fq "package:'monthly_optimization'" portal-admin-journey.js
          grep -Fq 'nexus_assign_action_package' portal-admin-journey.js
          grep -Fq 'nexus_admin_set_task_status' portal-journey-task-guard.js
          grep -Fq 'Complete engagement' portal-admin-journey.js
      - name: Atomic portal asset contract
        run: |
          set -euo pipefail
          grep -Fq "const asset=path=>\`/" portal-app.js
          grep -Fq 'portal-journey-reliability.js' portal-app.js
          grep -Fq 'portal-diagnosis-manual-fallback.js' portal-app.js
          if grep -Fq 'cdn.jsdelivr.net/gh/kyriestone61-del/nexus-intelligence-site@main' portal-app.js; then
            echo 'Portal is loading mutable main-branch CDN assets instead of the exact deployed build.' >&2
            exit 1
          fi
      - name: Browser secret safety
        run: |
          set -euo pipefail
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|GOOGLE_CALENDAR_PRIVATE_KEY|RESEND_API_KEY|AI_GATEWAY_API_KEY' portal-journey-reliability.js portal-diagnosis-manual-fallback.js; then
            echo 'Server-only credential reference found in browser-delivered Journey repair.' >&2
            exit 1
          fi
