name: Nexus vNext Free Runtime QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-vnext-runtime-router.js'
      - 'functions/api/diagnosis-report-pdf.js'
      - 'functions/api/sms-dispatch.js'
      - '.github/workflows/email-dispatch.yml'
      - 'qa/contracts/vnext-free-runtime.test.mjs'
      - '.github/workflows/vnext-free-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax
        run: |
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-vnext-runtime-router.js
          node --input-type=module --check < functions/api/diagnosis-report-pdf.js
          node --input-type=module --check < functions/api/sms-dispatch.js
      - name: Free-plan delivery contract
        run: node qa/contracts/vnext-free-runtime.test.mjs
      - name: Dispatcher independence contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'if ! dispatch "email" "$EMAIL_DISPATCH_URL"; then status=1; fi' .github/workflows/email-dispatch.yml
          grep -Fq 'if ! dispatch "sms" "$SMS_DISPATCH_URL"; then status=1; fi' .github/workflows/email-dispatch.yml
          grep -Fq 'exit "$status"' .github/workflows/email-dispatch.yml
