name: Nexus vNext Free Runtime QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-vnext-runtime-router.js'
      - 'functions/api/diagnosis-report-pdf.js'
      - 'supabase/functions/nexus-email-worker/**'
      - 'qa/contracts/vnext-free-runtime.test.mjs'
      - '.github/workflows/vnext-free-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and Cloudflare syntax
        run: |
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-vnext-runtime-router.js
          node --input-type=module --check < functions/api/diagnosis-report-pdf.js
      - name: Free-plan delivery contract
        run: node qa/contracts/vnext-free-runtime.test.mjs
      - name: Secured notification worker contract
        shell: bash
        run: |
          set -euo pipefail
          worker='supabase/functions/nexus-email-worker/index.ts'
          grep -Fq 'x-nexus-worker-token' "$worker"
          grep -Fq 'processEmail' "$worker"
          grep -Fq 'processSms' "$worker"
          grep -Fq 'nexus_email_outbox' "$worker"
          grep -Fq 'nexus_sms_outbox' "$worker"
          grep -Fq 'RESEND_API_KEY' "$worker"
          grep -Fq 'TWILIO_ACCOUNT_SID' "$worker"
