name: Nexus Email Dispatch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-email-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch queued Nexus email
        env:
          DISPATCH_SECRET: ${{ secrets.NEXUS_EMAIL_DISPATCH_SECRET }}
          DISPATCH_URL: https://nexusintelligence.live/api/email-dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_SECRET:-}" ]; then
            echo "NEXUS_EMAIL_DISPATCH_SECRET is not configured; leaving the queue untouched."
            exit 0
          fi

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_SECRET}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$DISPATCH_URL")"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Nexus email dispatch returned HTTP $http_code" >&2
            exit 1
          fi
