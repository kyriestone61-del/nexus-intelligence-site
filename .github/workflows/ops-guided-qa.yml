name: Nexus Portal Stability and Guided Ops QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-diagnosis-override.js'
      - 'portal-action-execution-v2.js'
      - 'portal-action-execution-v2-forms.js'
      - 'portal-guided-ops.js'
      - 'portal-guided-ops.css'
      - '.github/workflows/ops-guided-qa.yml'

permissions:
  contents: read

jobs:
  stability-guided-ops-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-diagnosis-override.js
          node --input-type=module --check < portal-action-execution-v2.js
          node --input-type=module --check < portal-action-execution-v2-forms.js
          node --input-type=module --check < portal-guided-ops.js
      - name: Layout stability assertions
        run: |
          set -euo pipefail
          grep -Fq 'importWithoutRecurringIntervals' portal-app.js
          grep -Fq 'softImport' portal-app.js
          grep -Fq 'withTimeout' portal-app.js
          grep -Fq "['portal-action-workflow.js','action workflow',[1200]]" portal-app.js
          grep -Fq "['portal-action-execution-v2.js','action execution']" portal-app.js
          grep -Fq "['portal-guided-ops.js','guided operations']" portal-app.js
          grep -Fq 'clearBootLock();' portal-app.js
          if grep -Fq "portal-action-execution-v2.js?v=\${BUILD}\`),[900]" portal-app.js; then
            echo 'Rich Action Items 900ms reconciliation must not be suppressed; workspace refreshes otherwise restore the legacy task renderer.' >&2
            exit 1
          fi
          grep -Fq 'setInterval(()=>reconcile(false).catch(console.error),900)' portal-action-execution-v2.js
          if grep -Fq 'setInterval(enhance,450)' portal-action-execution-v2-forms.js; then
            echo '450ms DOM polling must not return.' >&2
            exit 1
          fi
          grep -Fq 'requestAnimationFrame(enhance)' portal-action-execution-v2-forms.js
          grep -Fq 'scrollbar-gutter:stable' portal-guided-ops.css
          grep -Fq 'overflow-anchor:none' portal-guided-ops.css
      - name: Diagnosis observer starvation guard
        run: |
          set -euo pipefail
          grep -Fq 'observer?.disconnect()' portal-diagnosis-override.js
          grep -Fq 'requestAnimationFrame(()=>{normalizationScheduled=false;normalizeCards()})' portal-diagnosis-override.js
          grep -Fq 'observer?.observe(document.body,observerOptions)' portal-diagnosis-override.js
          grep -Fq 'setHTML(action,html)' portal-diagnosis-override.js
          if grep -Fq 'new MutationObserver(()=>normalizeCards())' portal-diagnosis-override.js; then
            echo 'Unsafe self-triggering diagnosis observer must not return.' >&2
            exit 1
          fi
      - name: Guided form assertions
        run: |
          set -euo pipefail
          grep -Fq 'Approval type' portal-guided-ops.js
          grep -Fq 'Production launch / go-live' portal-guided-ops.js
          grep -Fq 'Automation type' portal-guided-ops.js
          grep -Fq 'Lead capture & routing' portal-guided-ops.js
          grep -Fq 'Improvement type' portal-guided-ops.js
          grep -Fq 'Time saved' portal-guided-ops.js
          grep -Fq 'Milestone type' portal-guided-ops.js
          grep -Fq 'QA/QC complete' portal-guided-ops.js
          grep -Fq 'Description / context (optional)' portal-guided-ops.js
          grep -Fq 'Description / business purpose (optional)' portal-guided-ops.js
          grep -Fq 'Description / measurement note (optional)' portal-guided-ops.js
          grep -Fq 'Description (optional)' portal-guided-ops.js
          grep -Fq 'What belongs in Approvals to Send?' portal-guided-ops.js
      - name: Browser-secret assertion
        run: |
          set -euo pipefail
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY' portal-diagnosis-override.js portal-guided-ops.js portal-guided-ops.css; then
            echo 'Privileged credential reference found in browser-delivered files.' >&2
            exit 1
          fi
