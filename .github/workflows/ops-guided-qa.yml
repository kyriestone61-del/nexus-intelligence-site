name: Nexus Portal Stability and Guided Ops QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-action-execution-v2-forms.js'
      - 'portal-guided-ops.js'
      - 'portal-guided-ops.css'
      - '.github/workflows/ops-guided-qa.yml'

permissions:
  contents: read

jobs:
  stability-guided-ops-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-action-execution-v2-forms.js
          node --input-type=module --check < portal-guided-ops.js
      - name: Layout stability assertions
        run: |
          set -euo pipefail
          grep -Fq 'importWithoutRecurringIntervals' portal-app.js
          grep -Fq "[1200]" portal-app.js
          grep -Fq "[900]" portal-app.js
          if grep -Fq 'setInterval(enhance,450)' portal-action-execution-v2-forms.js; then
            echo '450ms DOM polling must not return.' >&2
            exit 1
          fi
          grep -Fq 'requestAnimationFrame(enhance)' portal-action-execution-v2-forms.js
          grep -Fq 'scrollbar-gutter:stable' portal-guided-ops.css
          grep -Fq 'overflow-anchor:none' portal-guided-ops.css
      - name: Guided form assertions
        run: |
          set -euo pipefail
          grep -Fq 'Approval type' portal-guided-ops.js
          grep -Fq 'Production launch / go-live' portal-guided-ops.js
          grep -Fq 'Automation type' portal-guided-ops.js
          grep -Fq 'Lead capture & routing' portal-guided-ops.js
          grep -Fq 'Improvement type' portal-guided-ops.js
          grep -Fq 'Time saved' portal-guided-ops.js
          grep -Fq 'Milestone type' portal-guided-ops.js
          grep -Fq 'QA/QC complete' portal-guided-ops.js
          grep -Fq 'Description / context (optional)' portal-guided-ops.js
          grep -Fq 'Description / business purpose (optional)' portal-guided-ops.js
          grep -Fq 'Description / measurement note (optional)' portal-guided-ops.js
          grep -Fq 'Description (optional)' portal-guided-ops.js
          grep -Fq 'What belongs in Approvals to Send?' portal-guided-ops.js
      - name: Browser-secret assertion
        run: |
          set -euo pipefail
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY' portal-guided-ops.js portal-guided-ops.css; then
            echo 'Privileged credential reference found in browser-delivered files.' >&2
            exit 1
          fi
