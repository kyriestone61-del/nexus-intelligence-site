name: Nexus Simple Client Experience QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-client-guide.js'
      - 'portal-client-guide.css'
      - 'portal-foundation-hardening.js'
      - '.github/workflows/client-simple-guide-qa.yml'

permissions:
  contents: read

jobs:
  simple-client-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-client-guide.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-foundation-hardening.js
      - name: Five-destination navigation contract
        run: |
          set -euo pipefail
          grep -Fq "['overview','Home']" portal-client-guide.js
          grep -Fq "['documents','Files']" portal-client-guide.js
          grep -Fq "['diagnosis-reports','Reports']" portal-client-guide.js
          grep -Fq "['progress','Progress']" portal-client-guide.js
          grep -Fq "['help','Help']" portal-client-guide.js
          grep -Fq "client-source-nav" portal-client-guide.js
          grep -Fq "grid-template-columns:repeat(5,minmax(0,1fr))" portal-client-guide.css
      - name: Client status language contract
        run: |
          set -euo pipefail
          grep -Fq "Waiting on you" portal-client-guide.js
          grep -Fq "Nexus working" portal-client-guide.js
          grep -Fq "Ready to review" portal-client-guide.js
          grep -Fq "Complete" portal-client-guide.js
          grep -Fq "Blocked" portal-client-guide.js
      - name: FAQ and Nexus Guide contract
        run: |
          set -euo pipefail
          grep -Fq "const faqs=[" portal-client-guide.js
          grep -Fq "clientFaqSearch" portal-client-guide.js
          grep -Fq "nexusGuideDrawer" portal-client-guide.js
          grep -Fq "What do I need to do?" portal-client-guide.js
          grep -Fq "prepareRequest" portal-client-guide.js
          grep -Fq "Review it, then tap Submit request" portal-client-guide.js
          grep -Fq "NexusClientGuide" portal-client-guide.js
      - name: Client-only boot boundary
        run: |
          set -euo pipefail
          grep -Fq "if(isSignedIn&&!isAdmin)await requiredImport(asset(\`portal-client-guide.js?v=\${BUILD}\`),'simple client experience and Nexus Guide');" portal-app.js
          grep -Fq "if(state.admin)throw new Error('Client Guide must not load in the Nexus admin workspace.')" portal-client-guide.js
          grep -Fq "portal-client-guide.css" portal-app.js
      - name: Mobile client contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-client-guide.css
          grep -Fq '@media(max-width:390px)' portal-client-guide.css
          grep -Fq 'position:fixed!important' portal-client-guide.css
          grep -Fq 'bottom:calc(78px + env(safe-area-inset-bottom))' portal-client-guide.css
          grep -Fq 'font-size:16px' portal-client-guide.css
      - name: Client-safe Company Memory boundary
        run: |
          set -euo pipefail
          grep -Fq "table==='nexus_company_memory'?memoryNoop():target.from(table)" portal-foundation-hardening.js
          grep -Fq "sb.rpc('nexus_get_company_memory_client'" portal-foundation-hardening.js
          if grep -Fq "sb.from('nexus_company_memory').select('*')" portal-foundation-hardening.js; then
            echo 'Client hardening layer regressed to a raw Company Memory SELECT.' >&2
            exit 1
          fi
