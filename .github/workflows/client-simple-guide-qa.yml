name: Nexus Simple Client Experience QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-client-core.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-foundation-hardening.js'
      - '.github/workflows/client-simple-guide-qa.yml'

permissions:
  contents: read

jobs:
  simple-client-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-client-core.js
          node --input-type=module --check < portal-client-shell-v2.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-foundation-hardening.js
      - name: Primary navigation and utilities contract
        run: |
          set -euo pipefail
          grep -Fq "['today','01 Today']" portal-client-shell-v2.js
          grep -Fq "['files','02 Secure Data Room']" portal-client-shell-v2.js
          grep -Fq "['improvement','03 Improvement Record']" portal-client-shell-v2.js
          grep -Fq "nexusClientReportsButton" portal-client-shell-v2.js
          grep -Fq "nexusClientHelpButton" portal-client-shell-v2.js
          grep -Fq "nexusClientInboxButton" portal-client-shell-v2.js
          grep -Fq "nexus-client-legacy-nav" portal-client-shell-v2.css
      - name: Client status language contract
        run: |
          set -euo pipefail
          grep -Fq "WAITING_ON_YOU: 'Waiting on you'" portal-client-core.js
          grep -Fq "NEXUS_WORKING: 'Nexus working'" portal-client-core.js
          grep -Fq "READY_TO_REVIEW: 'Ready to review'" portal-client-core.js
          grep -Fq "COMPLETE: 'Complete'" portal-client-core.js
          grep -Fq "BLOCKED: 'Blocked'" portal-client-core.js
      - name: FAQ and Nexus Guide contract
        run: |
          set -euo pipefail
          grep -Fq "const FAQS=[" portal-client-shell-v2.js
          grep -Fq "nexusClientGuideDrawer" portal-client-shell-v2.js
          grep -Fq "What do I need to do?" portal-client-shell-v2.js
          grep -Fq "What should I upload?" portal-client-shell-v2.js
          grep -Fq "Where is my report?" portal-client-shell-v2.js
          grep -Fq "I do not have a confident workspace answer for that." portal-client-shell-v2.js
      - name: Client-only boot boundary
        run: |
          set -euo pipefail
          grep -Fq "portal-client-shell-v2.js?v=\${BUILD}" portal-app.js
          grep -Fq "reconciled client shell" portal-app.js
          grep -Fq "if(state.admin)throw new Error('Client Shell must not load in the Nexus admin workspace.')" portal-client-shell-v2.js
          grep -Fq "portal-client-shell-v2.css" portal-app.js
      - name: Mobile client contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:900px)' portal-client-shell-v2.css
          grep -Fq '@media(max-width:760px)' portal-client-shell-v2.css
          grep -Fq '@media(max-width:390px)' portal-client-shell-v2.css
          grep -Fq 'font-size:16px!important' portal-client-shell-v2.css
          grep -Fq 'min-height:44px' portal-client-shell-v2.css
          grep -Fq 'padding-bottom:calc(20px + env(safe-area-inset-bottom))' portal-client-shell-v2.css
      - name: Client-safe Company Memory boundary
        run: |
          set -euo pipefail
          grep -Fq "table==='nexus_company_memory'?memoryNoop():target.from(table)" portal-foundation-hardening.js
          grep -Fq "sb.rpc('nexus_get_company_memory_client'" portal-foundation-hardening.js
          if grep -Fq "sb.from('nexus_company_memory').select('*')" portal-foundation-hardening.js; then
            echo 'Client hardening layer regressed to a raw Company Memory SELECT.' >&2
            exit 1
          fi
