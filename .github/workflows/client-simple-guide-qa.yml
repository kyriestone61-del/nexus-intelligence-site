name: Nexus Simple Client Experience QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-nexus-store.js'
      - 'portal-client-control-room.js'
      - 'portal-client-control-room.css'
      - 'portal-health-check.js'
      - 'portal-foundation-hardening.js'
      - '.github/workflows/client-simple-guide-qa.yml'
permissions:
  contents: read
jobs:
  simple-client-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-nexus-store.js
          node --input-type=module --check < portal-client-control-room.js
          node --input-type=module --check < portal-health-check.js
          node --input-type=module --check < portal-app.js
      - name: Seven-destination navigation contract
        run: |
          set -euo pipefail
          for pair in "overview Today" "intake Intake" "data-room Data Room" "action-queue Actions" "roadmap Roadmap" "ledger Value" "inbox Inbox"; do
            set -- $pair; grep -Fq "'$1'" portal-client-control-room.js
          done
          grep -Fq 'Workspace navigation' portal-client-control-room.js
          grep -Fq 'aria-selected' portal-client-control-room.js
      - name: Frictionless lifecycle contract
        run: |
          set -euo pipefail
          grep -Fq 'Your Next Single Step' portal-client-control-room.js
          grep -Fq 'Business Profile' portal-client-control-room.js
          grep -Fq 'Operational Bottlenecks' portal-client-control-room.js || grep -Fq 'Bottlenecks' portal-client-control-room.js
          grep -Fq 'Discovery Context' portal-client-control-room.js
          for phase in Discovery Diagnosis Prioritization Implementation Optimization; do grep -Fq "$phase" portal-client-control-room.js; done
          grep -Fq 'preserveUploadNode' portal-client-control-room.js
      - name: Client-only boot boundary
        run: |
          set -euo pipefail
          grep -Fq "const useClientShell=isSignedIn&&(!platformAdmin||portal.state?.viewMode==='client');" portal-app.js
          grep -Fq 'portal-client-control-room.css' portal-app.js
          grep -Fq 'portal-client-control-room.js' portal-app.js
          if grep -Eq 'portal-client-shell(?:-v2)?\.(js|css)' portal-app.js; then exit 1; fi
      - name: Mobile client contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-client-control-room.css
          grep -Fq '@media(max-width:390px)' portal-client-control-room.css
          grep -Fq 'env(safe-area-inset-bottom)' portal-client-control-room.css
          grep -Fq 'font-size:16px!important' portal-client-control-room.css
          grep -Fq 'min-height:44px' portal-client-control-room.css
      - name: Health and Company Memory boundaries
        run: |
          set -euo pipefail
          grep -Fq 'window.__NEXUS_HEALTH_CHECK' portal-health-check.js
          grep -Fq 'persistent test writes: 0' portal-health-check.js
          grep -Fq "table==='nexus_company_memory'?memoryNoop():target.from(table)" portal-foundation-hardening.js
          grep -Fq "sb.rpc('nexus_get_company_memory_client'" portal-foundation-hardening.js
