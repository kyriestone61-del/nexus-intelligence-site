name: Nexus Simple Client Experience QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-client-shell.js'
      - 'portal-client-shell.css'
      - 'portal-health-check.js'
      - 'portal-foundation-hardening.js'
      - '.github/workflows/client-simple-guide-qa.yml'

permissions:
  contents: read

jobs:
  simple-client-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-client-shell.js
          node --input-type=module --check < portal-health-check.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-foundation-hardening.js
      - name: Six-destination navigation contract
        run: |
          set -euo pipefail
          grep -Fq "['overview', 'Today']" portal-client-shell.js
          grep -Fq "['data-room', 'Data Room']" portal-client-shell.js
          grep -Fq "['action-queue', 'Actions']" portal-client-shell.js
          grep -Fq "['projects', 'Projects']" portal-client-shell.js
          grep -Fq "['ledger', 'Improvements']" portal-client-shell.js
          grep -Fq "['notifications', 'Notifications']" portal-client-shell.js
          grep -Fq 'Workspace navigation' portal-client-shell.js
          grep -Fq 'aria-selected' portal-client-shell.js
      - name: Client status and simplicity contract
        run: |
          set -euo pipefail
          grep -Fq 'Your Next Single Step' portal-client-shell.js
          grep -Fq 'Waiting on you' portal-client-shell.js
          grep -Fq 'Nexus working' portal-client-shell.js
          grep -Fq 'Complete' portal-client-shell.js
          grep -Fq 'Data Room Readiness' portal-client-shell.js
          grep -Fq 'data-room-dropzone' portal-client-shell.js
          grep -Fq '<details' portal-client-shell.js
      - name: Client-only boot boundary
        run: |
          set -euo pipefail
          grep -Fq "const useClientShell=isSignedIn&&(!platformAdmin||portal.state?.viewMode==='client');" portal-app.js
          grep -Fq "portal-client-shell.css" portal-app.js
          grep -Fq "portal-client-shell.js?v=\${BUILD}" portal-app.js
          grep -Fq "portal-health-check.js?v=\${BUILD}" portal-app.js
          grep -Fq "if (state.admin && state.viewMode !== 'client') throw new Error('Client Shell must not load in the Nexus admin workspace.');" portal-client-shell.js
          if grep -Eq 'portal-client-shell-v2\.(js|css)' portal-app.js; then
            echo 'Stale V2 client shell still present in production loader.' >&2
            exit 1
          fi
      - name: Mobile client contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-client-shell.css
          grep -Fq '@media(max-width:390px)' portal-client-shell.css
          grep -Fq 'position:fixed' portal-client-shell.css
          grep -Fq 'env(safe-area-inset-bottom)' portal-client-shell.css
          grep -Fq 'font-size:16px!important' portal-client-shell.css
          grep -Fq 'min-height:44px' portal-client-shell.css
      - name: Self-healing utility contract
        run: |
          set -euo pipefail
          grep -Fq 'window.__NEXUS_HEALTH_CHECK' portal-health-check.js
          grep -Fq 'No console errors during check' portal-health-check.js
          grep -Fq 'Company selector' portal-health-check.js
      - name: Client-safe Company Memory boundary
        run: |
          set -euo pipefail
          grep -Fq "table==='nexus_company_memory'?memoryNoop():target.from(table)" portal-foundation-hardening.js
          grep -Fq "sb.rpc('nexus_get_company_memory_client'" portal-foundation-hardening.js
          if grep -Fq "sb.from('nexus_company_memory').select('*')" portal-foundation-hardening.js; then
            echo 'Client hardening layer regressed to a raw Company Memory SELECT.' >&2
            exit 1
          fi
