name: Nexus Portal Shell Reset QA

on:
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - '.github/workflows/portal-shell-reset-qa.yml'

permissions:
  contents: read

jobs:
  portal-shell-reset-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --input-type=module --check < portal-app.js
      - name: Immutable deployment shell contract
        run: |
          set -euo pipefail
          grep -Fq 'id="nexus-shell-preboot"' portal.html
          grep -Fq '#portalApp{visibility:hidden!important}' portal.html
          grep -Fq 'body.nexus-shell-ready #portalApp{visibility:visible!important}' portal.html
          grep -Fq '/styles.css?v=20260831-shell-reset2' portal.html
          grep -Fq '/portal-ops.css?v=20260831-shell-reset2' portal.html
          grep -Fq '/portal-v2.css?v=20260831-shell-reset2' portal.html
          grep -Fq '/portal-security-hardening.js?v=20260831-shell-reset2' portal.html
          grep -Fq '/portal-app.js?v=20260831-shell-reset2' portal.html
          grep -Fq "const BUILD='20260831-shell-reset2'" portal-app.js
          grep -Fq "document.body.classList.add('nexus-shell-ready');" portal-app.js
          if grep -Fq 'cdn.jsdelivr.net/gh/kyriestone61-del/nexus-intelligence-site@main' portal.html; then
            echo 'Mutable @main CDN portal asset detected.' >&2
            exit 1
          fi
          if grep -Fq '<script type="importmap">' portal.html; then
            echo 'Legacy portal importmap detected.' >&2
            exit 1
          fi
      - name: Final-layout reveal ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('portal.html').read_text()
          app=Path('portal-app.js').read_text()
          assert html.index('nexus-shell-preboot') < html.index('id="portalApp"')
          assert app.index("labels.includes('Client Journey')") < app.rindex('clearBootLock();')
          assert app.index("labels.includes('Discovery & Diagnosis')") < app.rindex('clearBootLock();')
          assert app.index("document.body.classList.add('nexus-shell-ready');") < app.rindex('clearBootLock();')
          print('Portal cannot reveal before final role-specific navigation.')
          PY
