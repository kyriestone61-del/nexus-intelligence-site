name: Nexus Portal Shell Reset QA

on:
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - '.github/workflows/portal-shell-reset-qa.yml'

permissions:
  contents: read

jobs:
  portal-shell-reset-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --input-type=module --check < portal-app.js
      - name: Immutable deployment shell contract
        run: |
          set -euo pipefail
          grep -Fq 'id="nexus-shell-preboot"' portal.html
          grep -Fq '#portalApp{visibility:hidden!important}' portal.html
          grep -Fq 'body.nexus-shell-ready #portalApp{visibility:visible!important}' portal.html
          grep -Fq '/styles.css?v=20260831-discovery-capture1' portal.html
          grep -Fq '/portal-ops.css?v=20260831-discovery-capture1' portal.html
          grep -Fq '/portal-v2.css?v=20260831-discovery-capture1' portal.html
          grep -Fq '/portal-security-hardening.js?v=20260831-discovery-capture1' portal.html
          grep -Fq '/portal-app.js?v=20260831-discovery-capture1' portal.html
          grep -Eq "^const BUILD='[0-9]{8}-[A-Za-z0-9._-]+';" portal-app.js
          grep -Fq "document.body.classList.add('nexus-shell-ready');" portal-app.js
          grep -Fq 'softImport' portal-app.js
          grep -Fq 'withTimeout' portal-app.js
          if grep -Fq 'cdn.jsdelivr.net/gh/kyriestone61-del/nexus-intelligence-site@main' portal.html; then
            echo 'Mutable @main CDN portal asset detected.' >&2
            exit 1
          fi
          if grep -Fq '<script type="importmap">' portal.html; then
            echo 'Legacy portal importmap detected.' >&2
            exit 1
          fi
      - name: Non-blocking reveal ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('portal.html').read_text()
          app=Path('portal-app.js').read_text()
          assert html.index('nexus-shell-preboot') < html.index('id="portalApp"')
          decision=app.index("const useClientShell=isSignedIn&&(!platformAdmin||portal.state?.viewMode==='client')")
          ready=app.index("document.body.classList.add('nexus-shell-ready');")
          unlock=app.index('clearBootLock();', decision)
          client_hydration=app.index('async function hydrateClientShell()', unlock)
          admin_hydration=app.index('async function hydrateAdminShell()', client_hydration)
          assert ready < unlock < client_hydration < admin_hydration
          assert "document.body.classList.contains('nexus-shell-ready')" in app
          assert "Core workspace is still available." in app
          print('Portal reveals the authenticated core shell before non-critical enhancements.')
          PY
