name: Nexus Control Room Reconciliation QA

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-nexus-store.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-pdf-service.js'
      - 'portal-client-control-room.js'
      - 'portal-client-control-room.css'
      - 'portal-admin-command-center.js'
      - 'portal-admin-command-center.css'
      - 'portal-health-check.js'
      - 'portal-perspective-switcher.js'
      - 'tests/client-shell-refactor-qaqc.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/control-room-reconciliation.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-nexus-store.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-pdf-service.js'
      - 'portal-client-control-room.js'
      - 'portal-client-control-room.css'
      - 'portal-admin-command-center.js'
      - 'portal-admin-command-center.css'
      - 'portal-health-check.js'
      - 'portal-perspective-switcher.js'
      - 'tests/client-shell-refactor-qaqc.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/control-room-reconciliation.yml'
permissions:
  contents: read
jobs:
  architecture-qaqc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript compile gates
        run: |
          set -euo pipefail
          for file in portal-app.js portal-client.js portal-auth.js portal-runtime-core.js portal-accessibility.js portal-nexus-store.js portal-client-core.js portal-client-pdf-service.js portal-client-upload-service.js portal-client-control-room.js portal-admin-command-center.js portal-health-check.js; do
            node --input-type=module --check < "$file"
          done
      - name: Architectural regression contract
        run: |
          set -euo pipefail
          node tests/client-shell-refactor-qaqc.mjs
          ! grep -Eq '\.onclick\s*=|\.onchange\s*=' portal-client.js portal-client-control-room.js portal-admin-command-center.js portal-auth.js portal-accessibility.js
          ! grep -q "from '/portal-ops.js'" portal-client.js
          ! grep -q 'initOps(' portal-client.js
          ! grep -Eq 'portal-client-shell(?:-v2)?\.(js|css)' portal-app.js
          grep -q 'nexus_activate_client_workspace' portal-client.js
          grep -q 'portal-nexus-store.js' portal-app.js
          grep -q 'portal-client-control-room.js' portal-app.js
          grep -q 'portal-client-pdf-service.js' portal-client-upload-service.js
          grep -q 'portal-admin-command-center.js' portal-app.js
          grep -q 'preserveUploadNode' portal-client-control-room.js
          grep -q 'nexus_client_intake' portal-client-control-room.js
          grep -q 'nexus_roi_estimates' portal-admin-command-center.js
          grep -q 'nexus_request_entity_approval' portal-admin-command-center.js
          grep -q 'DIAGNOSIS_BUILDER' portal-admin-command-center.js
          grep -q 'window.__NEXUS_HEALTH_CHECK' portal-health-check.js
          grep -q 'persistent test writes: 0' portal-health-check.js
          if grep -q 'new MutationObserver' portal-client-control-room.js portal-admin-command-center.js portal-accessibility.js; then
            echo 'Reconciled Control Room must not use DOM mutation rewrite loops.' >&2
            exit 1
          fi
      - name: Database migration contract
        run: |
          set -euo pipefail
          file='supabase/migrations/20260901211143_nexus_client_intake_roi_engine.sql'
          grep -q 'create table if not exists public.nexus_client_intake' "$file"
          grep -q 'create table if not exists public.nexus_roi_estimates' "$file"
          grep -q 'enable row level security' "$file"
          grep -q 'nexus members view published roi estimates' "$file"
          legacy='supabase/migrations/20260901_nexus_atomic_client_workspace_activation.sql'
          grep -q 'pg_advisory_xact_lock' "$legacy"
          grep -q 'insert into public.nexus_companies' "$legacy"
          grep -q 'insert into public.nexus_company_members' "$legacy"
          grep -q 'insert into public.nexus_projects' "$legacy"
