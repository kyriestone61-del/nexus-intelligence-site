name: Nexus Control Room Reconciliation QA

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'core/document-context.js'
      - 'core/document-service.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'portal-task-file-attachments.js'
      - 'portal-task-file-attachments-live.js'
      - 'portal-task-file-attachments.css'
      - 'portal-perspective-switcher.js'
      - 'tests/client-shell-refactor-qaqc.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/control-room-reconciliation.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'core/document-context.js'
      - 'core/document-service.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'portal-task-file-attachments.js'
      - 'portal-task-file-attachments-live.js'
      - 'portal-task-file-attachments.css'
      - 'portal-perspective-switcher.js'
      - 'tests/client-shell-refactor-qaqc.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/control-room-reconciliation.yml'

permissions:
  contents: read

jobs:
  architecture-qaqc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript compile gates
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-client.js
          node --input-type=module --check < portal-auth.js
          node --input-type=module --check < portal-runtime-core.js
          node --input-type=module --check < portal-accessibility.js
          node --input-type=module --check < portal-client-core.js
          node --input-type=module --check < core/document-context.js
          node --input-type=module --check < core/document-service.js
          node --input-type=module --check < portal-client-upload-service.js
          node --input-type=module --check < portal-client-shell-v2.js
          node --input-type=module --check < portal-task-file-attachments.js
          node --input-type=module --check < portal-task-file-attachments-live.js
      - name: Architectural regression contract
        run: |
          set -euo pipefail
          node tests/client-shell-refactor-qaqc.mjs
          ! grep -Eq '\.onclick\s*=|\.onchange\s*=' portal-client.js portal-client-shell-v2.js portal-auth.js portal-accessibility.js
          ! grep -q "from '/portal-ops.js'" portal-client.js
          ! grep -q 'initOps(' portal-client.js
          grep -q 'nexus_activate_client_workspace' portal-client.js
          grep -Fq "['home','Home']" portal-client-shell-v2.js
          grep -Fq "['tasks','Tasks']" portal-client-shell-v2.js
          grep -Fq "['files','Files']" portal-client-shell-v2.js
          grep -Fq "['reports','Reports']" portal-client-shell-v2.js
          grep -q 'portal-runtime-hardening.css' portal-app.js
          grep -q 'portal-client-shell-simple.css' portal-app.js
          grep -q 'portal-client-upload-service.js' portal-app.js
          grep -q 'portal-client-shell-v2.js' portal-app.js
          grep -q 'portal.prepareUpload' portal-client-shell-v2.js
          grep -q 'portal.services.clientUpload=service' portal-client-upload-service.js
          grep -q "Object.defineProperty(portal,'prepareUpload'" portal-client-upload-service.js
          grep -q 'documents.uploadFile' portal-client-upload-service.js
          grep -q 'documents.uploadFilesForTask' portal-client-upload-service.js
          grep -q 'documents.createDownloadTarget' portal-client-upload-service.js
          grep -Fq 'request_id:requestId||null' core/document-service.js
          grep -Fq 'data_requirement_id:requirementId||null' core/document-service.js
          grep -Fq 'task_id:task?.id||null' core/document-service.js
          grep -q 'portal-task-file-attachments.js' portal-client-upload-service.js
          if grep -q 'new MutationObserver' portal-client-shell-v2.js portal-accessibility.js; then
            echo 'Client Control Room core shell must not use DOM mutation rewrite loops.' >&2
            exit 1
          fi
          if grep -Eq "from\('nexus_tasks'\)\.select|from\('nexus_document_requests'\)" portal-client-shell-v2.js; then
            echo 'Client shell must not duplicate bounded workspace reads.' >&2
            exit 1
          fi
      - name: Mobile simplified shell contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-client-shell-simple.css
          grep -Fq '@media(max-width:390px)' portal-client-shell-simple.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' portal-client-shell-simple.css
          grep -Fq 'font-size:16px!important' portal-client-shell-simple.css
          grep -Fq 'env(safe-area-inset-bottom)' portal-client-shell-v2.css
      - name: Database migration contract
        run: |
          set -euo pipefail
          file='supabase/migrations/20260901_nexus_atomic_client_workspace_activation.sql'
          grep -q 'pg_advisory_xact_lock' "$file"
          grep -q 'insert into public.nexus_companies' "$file"
          grep -q 'insert into public.nexus_company_members' "$file"
          grep -q 'insert into public.nexus_projects' "$file"
          grep -q 'grant execute.*authenticated' "$file"
          grep -q 'task_id uuid references public.nexus_tasks' supabase/migrations/20260903_nexus_task_document_attachments.sql
          grep -q 'nexus_validate_document_task_company' supabase/migrations/20260903_nexus_task_document_company_guard.sql
