name: Nexus Candidate Password Recovery QA

on:
  pull_request:
    paths:
      - 'portal-auth.js'
      - 'qa/scripts/password-recovery-contract-audit.mjs'
      - '.github/workflows/candidate-password-recovery-qaqc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --input-type=module --check < portal-auth.js
      - name: Security and recovery contract
        run: node qa/scripts/password-recovery-contract-audit.mjs
