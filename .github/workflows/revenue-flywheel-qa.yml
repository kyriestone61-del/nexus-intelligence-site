name: Nexus Revenue Flywheel QA

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260831_nexus_revenue_flywheel_*.sql'
      - 'supabase/functions/nexus-email-worker/index.ts'
      - 'portal-revenue-engine.js'
      - 'portal-revenue-engine.css'
      - 'portal-app.js'
      - 'qa/contracts/revenue-flywheel.test.mjs'
      - 'qa/contracts/revenue-suppression-sync.test.mjs'
      - 'qa/contracts/revenue-cascade-delete-guard.test.mjs'
      - '.github/workflows/revenue-flywheel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revenue-flywheel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Worker TypeScript syntax and types
        run: deno check --no-lock supabase/functions/nexus-email-worker/index.ts
      - name: Revenue Engine browser-module syntax
        run: node --check portal-revenue-engine.js
      - name: Revenue flywheel contract
        run: node qa/contracts/revenue-flywheel.test.mjs
      - name: Suppression exception sync contract
        run: node qa/contracts/revenue-suppression-sync.test.mjs
      - name: Cascade delete guard contract
        run: node qa/contracts/revenue-cascade-delete-guard.test.mjs
      - name: No autonomous outbound send contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq "nexus_outreach_sequence_steps.*nexus_email_outbox|nexus_email_outbox.*nexus_outreach_sequence_steps" supabase/migrations/20260831_nexus_revenue_flywheel_*.sql
          grep -Fq "qa_status='passed'" supabase/migrations/20260831_nexus_revenue_flywheel_04_release_controls.sql
          grep -Fq "now()+interval '3 days'" supabase/migrations/20260831_nexus_revenue_flywheel_04_release_controls.sql
          ! grep -Eqi "resend\.com|nexus_email_outbox|twilio" portal-revenue-engine.js
