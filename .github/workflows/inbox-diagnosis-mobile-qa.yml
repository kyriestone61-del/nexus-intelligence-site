name: Nexus Inbox Diagnosis Mobile QA

on:
  pull_request:
    paths:
      - 'portal-foundation-hardening.js'
      - 'portal-diagnosis-v2.js'
      - 'portal-diagnosis-v2.css'
      - 'portal-diagnosis-controller-v2.js'
      - 'portal-mobile-hardening.css'
      - '.github/workflows/inbox-diagnosis-mobile-qa.yml'

permissions:
  contents: read

jobs:
  inbox-diagnosis-mobile-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-foundation-hardening.js
          node --input-type=module --check < portal-diagnosis-v2.js
          node --input-type=module --check < portal-diagnosis-controller-v2.js
      - name: Inbox contract
        run: |
          set -euo pipefail
          grep -Fq "heading.textContent!=='Inbox'" portal-foundation-hardening.js
          grep -Fq "button.dataset.section='notifications'" portal-foundation-hardening.js
          grep -Fq "button.textContent='Inbox'" portal-foundation-hardening.js
          grep -Fq "section-notifications" portal-foundation-hardening.js
      - name: Cancellable diagnosis review contract
        run: |
          set -euo pipefail
          grep -Fq 'const LOAD_TIMEOUT_MS=4000' portal-diagnosis-v2.js
          grep -Fq 'activeReviewAbort?.abort()' portal-diagnosis-v2.js
          grep -Fq "event.key==='Escape'" portal-diagnosis-v2.js
          grep -Fq 'data-diagnosis-review-reload' portal-diagnosis-v2.js
          grep -Fq 'data-diagnosis-review-close' portal-diagnosis-v2.js
          grep -Fq 'Promise.race([loadRun(id,controller.signal),timeoutPromise])' portal-diagnosis-v2.js
          grep -Fq "select('id,status,analysis_result,execution_error,analysis_completed_at,orchestrated_at,orchestration_summary')" portal-diagnosis-v2.js
          if grep -Fq ".select('*').eq('id',id).single()" portal-diagnosis-v2.js; then
            echo 'Diagnosis review regressed to full-row fetch.' >&2
            exit 1
          fi
      - name: Direct diagnosis route contract
        run: |
          set -euo pipefail
          grep -Fq 'const canOpenDirectly=run=>' portal-diagnosis-controller-v2.js
          grep -Fq 'if(canOpenDirectly(run)&&window.NexusDiagnosisReviewRuntime?.openReview)' portal-diagnosis-controller-v2.js
          grep -Fq 'await window.NexusDiagnosisReviewRuntime.openReview(run.id);' portal-diagnosis-controller-v2.js
          python - <<'PY'
          from pathlib import Path
          js=Path('portal-diagnosis-controller-v2.js').read_text()
          start=js.index('async function openRun(run){')
          direct=js.index('window.NexusDiagnosisReviewRuntime?.openReview',start)
          intake=js.index('openIntake()',start)
          assert direct < intake, 'Reviewable diagnosis must open before any Discovery & Diagnosis navigation.'
          print('Reviewable diagnosis opens directly without exposing intake first.')
          PY
      - name: Diagnosis top-layer contract
        run: |
          set -euo pipefail
          grep -Fq '.portal-body #diagnosisReviewModal{' portal-diagnosis-v2.css
          grep -Fq 'position:fixed!important' portal-diagnosis-v2.css
          grep -Fq 'z-index:2147483000!important' portal-diagnosis-v2.css
          grep -Fq '.portal-body #diagnosisReviewModal.open{display:flex!important}' portal-diagnosis-v2.css
          grep -Fq 'height:100dvh!important' portal-diagnosis-v2.css
          grep -Fq 'body.portal-body.diagnosis-review-open{overflow:hidden!important' portal-diagnosis-v2.css
      - name: Mobile overflow contract
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-mobile-hardening.css
          grep -Fq '@media(max-width:390px)' portal-mobile-hardening.css
          grep -Fq 'overflow-x:hidden' portal-mobile-hardening.css
          grep -Fq 'max-height:calc(100dvh' portal-mobile-hardening.css
          grep -Fq 'grid-template-columns:1fr!important' portal-mobile-hardening.css
          grep -Fq 'font-size:16px!important' portal-mobile-hardening.css
      - name: Mobile Inbox preference control contract
        run: |
          set -euo pipefail
          grep -Fq 'input:not([type="checkbox"]):not([type="radio"])' portal-mobile-hardening.css
          grep -Fq 'input[type="checkbox"],.portal-body input[type="radio"]{width:20px!important;height:20px!important' portal-mobile-hardening.css
          grep -Fq '.portal-body .pref-toggle{display:grid!important;grid-template-columns:20px minmax(0,1fr)!important' portal-mobile-hardening.css
          grep -Fq '.portal-body #emailPreferencePanel{width:100%;max-width:100%;min-width:0;overflow:hidden}' portal-mobile-hardening.css
          if grep -Fq '.portal-body input,.portal-body select,.portal-body textarea{width:100%!important' portal-mobile-hardening.css; then
            echo 'Generic mobile input rule would stretch checkboxes/radios full width.' >&2
            exit 1
          fi
