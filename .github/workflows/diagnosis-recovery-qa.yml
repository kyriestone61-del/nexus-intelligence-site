name: Nexus Diagnosis Recovery QA

on:
  pull_request:
    paths:
      - 'portal-diagnosis-recovery.js'
      - 'portal-diagnosis-v2.css'
      - 'portal-app.js'
      - '.github/workflows/diagnosis-recovery-qa.yml'

permissions:
  contents: read

jobs:
  diagnosis-recovery-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-diagnosis-recovery.js
          node --input-type=module --check < portal-app.js
      - name: Recovery modal contract
        run: |
          set -euo pipefail
          grep -Fq '.portal-body .diagnosis-review-modal.open{display:flex}' portal-diagnosis-v2.css
          grep -Fq "in('status',['failed','blocked','revision_requested'])" portal-diagnosis-recovery.js
          grep -Fq '.diagnosis-review-btn[data-id=' portal-diagnosis-recovery.js
          grep -Fq 'instead of creating another failed run' portal-diagnosis-recovery.js
      - name: Queue ownership and load order
        run: |
          set -euo pipefail
          grep -Fq "event.target.closest?.('#queueDiagnosisBtn')" portal-diagnosis-recovery.js
          grep -Fq 'event.stopImmediatePropagation()' portal-diagnosis-recovery.js
          recovery_line=$(grep -n 'portal-diagnosis-recovery.js' portal-app.js | head -1 | cut -d: -f1)
          controller_line=$(grep -n 'portal-diagnosis-controller.js' portal-app.js | head -1 | cut -d: -f1)
          test "$recovery_line" -lt "$controller_line"
          grep -Fq 'const BUILD=' portal-app.js
      - name: Browser security
        run: |
          set -euo pipefail
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY|AI_GATEWAY_API_KEY' portal-diagnosis-recovery.js; then
            echo 'Privileged credential reference found in browser-delivered recovery code.' >&2
            exit 1
          fi
