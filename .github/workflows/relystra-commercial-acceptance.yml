name: RELYSTRA Commercial Acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-acceptance:
    # Keep Playwright's system dependencies stable across runner-image migrations.
    runs-on: ubuntu-24.04
    container:
      # Playwright 1.63.0 matches qa/playwright/package-lock.json and includes both browsers.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix qa/database --ignore-scripts
      - run: node qa/scripts/generate-delivery-catalog.mjs --check
      - run: node --test qa/contracts/*.test.mjs qa/relystra-delivery-lifecycle.test.mjs qa/relystra-release-safety.test.mjs qa/database/*.test.mjs
      - run: node --test tests/nepsis-homepage-qaqc.mjs tests/nepsis-public-pages-qaqc.mjs tests/nepsis-homepage-middleware-qaqc.mjs tests/nepsis-public-release-boundary.test.mjs
      - run: npm ci --prefix qa/playwright --ignore-scripts
      - run: qa/playwright/node_modules/.bin/playwright test --config qa/commercial-browser/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-acceptance-evidence
          path: |
            qa/commercial-browser/report
            qa/commercial-browser/test-results
            test-results
          if-no-files-found: ignore
