name: RELYSTRA Operational Full Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relystra-operational-full-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  operational-full-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/playwright
    env:
      NEXUS_QA_BASE_URL: https://nexus-intelligence-site.pages.dev
      NEXUS_QA_BOOTSTRAP_URL: https://dmdgkjksouhhsuojthav.supabase.co/functions/v1/nexus-calendar-config-check
      NEXUS_QA_FULL_BASELINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Confirm current production portal asset
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum ../../portal-production-simplification.js | awk '{print $1}')"
          deployed="$(mktemp)"
          matched=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 15 --header 'cache-control: no-cache' "$NEXUS_QA_BASE_URL/portal-production-simplification.js?qa_sha=${GITHUB_SHA}&attempt=${attempt}" --output "$deployed"; then
              actual="$(sha256sum "$deployed" | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then matched=1; break; fi
            fi
            sleep 5
          done
          test "$matched" = '1'
          echo "RELYSTRA_OPERATIONAL_ASSET_PARITY=CONFIRMED sha=$GITHUB_SHA"
      - name: Provision disposable authenticated QA identities
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$NEXUS_QA_BOOTSTRAP_URL"
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          provision_file="$(mktemp)"
          provision_code="$(curl --silent --show-error --request POST --output "$provision_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"provision"}' "$endpoint" || true)"
          provision="$(cat "$provision_file")"
          if [ "$provision_code" != '200' ]; then
            printf '%s' "$provision" | jq '{ok,error,stage}' || true
            exit 1
          fi
          printf '%s' "$provision" | jq -e '.ok == true' >/dev/null
          admin_email="$(printf '%s' "$provision" | jq -r '.admin_email')"
          admin_password="$(printf '%s' "$provision" | jq -r '.admin_password')"
          client_email="$(printf '%s' "$provision" | jq -r '.client_email')"
          client_password="$(printf '%s' "$provision" | jq -r '.client_password')"
          company_name="$(printf '%s' "$provision" | jq -r '.company_name')"
          for secret in "$admin_email" "$admin_password" "$client_email" "$client_password"; do echo "::add-mask::$secret"; done
          {
            echo "NEXUS_QA_ADMIN_EMAIL=$admin_email"
            echo "NEXUS_QA_ADMIN_PASSWORD=$admin_password"
            echo "NEXUS_QA_CLIENT_EMAIL=$client_email"
            echo "NEXUS_QA_CLIENT_PASSWORD=$client_password"
            echo "NEXUS_QA_COMPANY_NAME=$company_name"
          } >> "$GITHUB_ENV"
          echo "RELYSTRA_OPERATIONAL_QA=EPHEMERAL_READY company=$company_name"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full governed baseline only
        run: npx playwright test tests/baseline-workflow.spec.mjs --config=control-room.config.mjs --project=desktop-chrome
      - name: Cleanup disposable identities and company
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$NEXUS_QA_BOOTSTRAP_URL"
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          cleanup_file="$(mktemp)"
          cleanup_code="$(curl --silent --show-error --request POST --output "$cleanup_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"cleanup"}' "$endpoint" || true)"
          cleanup="$(cat "$cleanup_file")"
          if [ "$cleanup_code" != '200' ]; then
            printf '%s' "$cleanup" | jq '{ok,error,stage}' || true
            exit 1
          fi
          printf '%s' "$cleanup" | jq -e '.ok == true' >/dev/null
          echo 'RELYSTRA_OPERATIONAL_QA=CLEANED'
