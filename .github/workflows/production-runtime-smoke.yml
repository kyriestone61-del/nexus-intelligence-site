name: Nexus Production Runtime Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/production-runtime-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Nexus production
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nexusintelligence.live'
          report='production-smoke-report.txt'
          : > "$report"

          probe_get() {
            local name="$1" url="$2" expect="$3"
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$url")"
            echo "$name http=$code" | tee -a "$report"
            if [ "$code" != "200" ]; then
              echo "$name expected HTTP 200" >&2
              cat "$body" >&2
              exit 1
            fi
            if ! grep -Fq "$expect" "$body"; then
              echo "$name missing expected live marker: $expect" >&2
              head -c 2000 "$body" >&2
              exit 1
            fi
          }

          probe_unauth_post() {
            local name="$1" url="$2"
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$url")"
            echo "$name http=$code body=$(tr '\n' ' ' < "$body" | head -c 500)" | tee -a "$report"
            if [ "$code" != "401" ]; then
              echo "$name expected HTTP 401 from the live authenticated route" >&2
              cat "$body" >&2
              exit 1
            fi
          }

          probe_get 'portal-app' "$origin/portal-app.js" 'portal-vnext-runtime-router.js'
          probe_get 'runtime-router' "$origin/portal-vnext-runtime-router.js" '/api/diagnosis-report-pdf'
          grep -Fq '/api/sms-dispatch' <(curl --silent --show-error --location "$origin/portal-vnext-runtime-router.js")
          echo 'runtime-router sms-marker=present' | tee -a "$report"

          probe_unauth_post 'diagnosis-report-pdf' "$origin/api/diagnosis-report-pdf"
          probe_unauth_post 'sms-dispatch' "$origin/api/sms-dispatch"

          email_body="$(mktemp)"
          email_code="$(curl --silent --show-error --location --output "$email_body" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$origin/api/email-dispatch")"
          if [ "$email_code" = '401' ]; then
            echo 'email-dispatch http=401 configuration=ready auth-boundary=working' | tee -a "$report"
          elif [ "$email_code" = '503' ]; then
            echo "email-dispatch http=503 configuration=missing body=$(tr '\n' ' ' < "$email_body" | head -c 500)" | tee -a "$report"
          else
            echo "email-dispatch unexpected-http=$email_code" | tee -a "$report"
            cat "$email_body" >&2
            exit 1
          fi

          echo 'PRODUCTION_RUNTIME_SMOKE=PASS' | tee -a "$report"

      - name: Upload production smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-runtime-smoke
          path: production-smoke-report.txt
          retention-days: 30
