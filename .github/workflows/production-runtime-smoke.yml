name: Nexus Production Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - '.github/workflows/production-runtime-smoke.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - '.github/workflows/production-runtime-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Nexus production
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nexusintelligence.live'
          pages='https://nexus-intelligence-site.pages.dev'
          supabase='https://dmdgkjksouhhsuojthav.supabase.co/functions/v1'
          report='production-smoke-report.txt'
          : > "$report"

          expected_build="$(sed -n "s/^const BUILD='\([^']*\)';$/\1/p" portal-app.js | head -1)"
          if [ -z "$expected_build" ]; then
            echo 'Could not derive portal BUILD from repository source.' >&2
            exit 1
          fi
          echo "expected_build=$expected_build" | tee -a "$report"

          probe_get() {
            local name="$1" url="$2" expect="$3"
            local body code attempt
            body="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq "$expect" "$body"; then
                echo "$name http=$code marker=present attempt=$attempt" | tee -a "$report"
                return 0
              fi
              echo "$name attempt=$attempt http=${code:-curl_error} waiting_for='$expect'" | tee -a "$report"
              sleep 10
            done
            echo "$name failed: expected HTTP 200 and live marker: $expect" >&2
            head -c 2400 "$body" >&2 || true
            exit 1
          }

          probe_absent() {
            local name="$1" url="$2" forbidden="$3"
            local body code attempt
            body="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && ! grep -Fq "$forbidden" "$body"; then
                echo "$name http=$code forbidden_marker=absent attempt=$attempt" | tee -a "$report"
                return 0
              fi
              echo "$name attempt=$attempt http=${code:-curl_error} forbidden_marker_present='$forbidden'" | tee -a "$report"
              sleep 10
            done
            echo "$name failed: forbidden live marker is present: $forbidden" >&2
            head -c 2400 "$body" >&2 || true
            exit 1
          }

          probe_headers() {
            local name="$1" url="$2"
            local headers code
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$url")"
            echo "$name http=$code" | tee -a "$report"
            test "$code" = '200'
            tr -d '\r' < "$headers" | grep -Eiq '^cache-control:.*no-store'
            tr -d '\r' < "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          }

          probe_unauth_post() {
            local name="$1" url="$2" header_name="${3:-}" header_value="${4:-}"
            local body code
            body="$(mktemp)"
            if [ -n "$header_name" ]; then
              code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header "$header_name: $header_value" --data '{}' "$url")"
            else
              code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$url")"
            fi
            echo "$name http=$code body=$(tr '\n' ' ' < "$body" | head -c 500)" | tee -a "$report"
            if [ "$code" != "401" ]; then
              echo "$name expected HTTP 401 from the live protected route" >&2
              cat "$body" >&2
              exit 1
            fi
          }

          # Client Control Room V2: verify deployed production matches repository source.
          probe_get 'pages-portal' "$pages/portal" 'CONTROL ROOM'
          probe_headers 'pages-portal-security-headers' "$pages/portal"
          probe_get 'pages-portal-app-build' "$pages/portal-app.js" "$expected_build"
          probe_get 'pages-portal-app-shell-v2' "$pages/portal-app.js" 'portal-client-shell-v2.js'
          probe_get 'pages-portal-app-upload-service' "$pages/portal-app.js" 'portal-client-upload-service.js'
          probe_get 'pages-portal-fail-open' "$pages/portal-app.js" 'clearBootLock();'
          probe_get 'pages-runtime-core' "$pages/portal-runtime-core.js" 'createPortalRuntime'
          probe_get 'pages-shell-today' "$pages/portal-client-shell-v2.js" '01 Today'
          probe_get 'pages-shell-data-room' "$pages/portal-client-shell-v2.js" '02 Secure Data Room'
          probe_get 'pages-shell-improvement-record' "$pages/portal-client-shell-v2.js" '03 Improvement Record'
          probe_get 'pages-shell-upload-facade' "$pages/portal-client-shell-v2.js" 'portal.prepareUpload'
          probe_get 'pages-upload-isolation' "$pages/portal-client-upload-service.js" 'stopImmediatePropagation'
          probe_get 'pages-upload-owner' "$pages/portal-client-upload-service.js" 'portal.services.clientUpload=service'
          probe_get 'pages-upload-facade-owner' "$pages/portal-client-upload-service.js" "Object.defineProperty(portal,'prepareUpload'"
          probe_get 'pages-upload-request-linkage' "$pages/portal-client-upload-service.js" 'request_id:selection.requestId'

          # Regression guard for the September 1 lockout: Inbox refresh must be explicit/debounced,
          # never driven by a body-wide MutationObserver that can retrigger itself on render.
          probe_get 'pages-inbox-refresh-guard' "$pages/portal-approval-inbox.js" 'queueInboxRefresh'
          probe_absent 'pages-inbox-no-self-observer' "$pages/portal-approval-inbox.js" 'new MutationObserver'
          probe_absent 'pages-inbox-no-body-observer' "$pages/portal-approval-inbox.js" 'observer.observe(document.body'

          # Custom production domain must serve the same runtime and same lockout fix.
          probe_get 'custom-portal-app-build' "$origin/portal-app.js" "$expected_build"
          probe_get 'custom-portal-app-shell-v2' "$origin/portal-app.js" 'portal-client-shell-v2.js'
          probe_get 'custom-shell-improvement-record' "$origin/portal-client-shell-v2.js" '03 Improvement Record'
          probe_get 'custom-shell-upload-facade' "$origin/portal-client-shell-v2.js" 'portal.prepareUpload'
          probe_get 'custom-upload-facade-owner' "$origin/portal-client-upload-service.js" "Object.defineProperty(portal,'prepareUpload'"
          probe_get 'custom-inbox-refresh-guard' "$origin/portal-approval-inbox.js" 'queueInboxRefresh'
          probe_absent 'custom-inbox-no-self-observer' "$origin/portal-approval-inbox.js" 'new MutationObserver'

          # Existing administrator/runtime safety probes remain required.
          probe_get 'runtime-router' "$origin/portal-vnext-runtime-router.js" '/api/diagnosis-report-pdf'
          probe_get 'runtime-router-sms' "$origin/portal-vnext-runtime-router.js" "status:'scheduled'"

          # Protected server-side surfaces must reject anonymous callers.
          probe_unauth_post 'diagnosis-report-pdf' "$origin/api/diagnosis-report-pdf"
          probe_unauth_post 'notification-worker' "$supabase/nexus-email-worker" 'x-nexus-worker-token' 'invalid-smoke-token'

          echo 'PRODUCTION_RUNTIME_SMOKE=PASS' | tee -a "$report"

      - name: Upload production smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-runtime-smoke
          path: production-smoke-report.txt
          retention-days: 30
