name: One-shot authenticated Nexus release gate

on:
  push:
    branches:
      - qaqc/authenticated-release-gate-20260901

permissions:
  contents: read

jobs:
  mandatory-authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/playwright
    env:
      NEXUS_QA_BASE_URL: https://nexusintelligence.live
      NEXUS_QA_ADMIN_EMAIL: ${{ secrets.NEXUS_QA_ADMIN_EMAIL }}
      NEXUS_QA_ADMIN_PASSWORD: ${{ secrets.NEXUS_QA_ADMIN_PASSWORD }}
      NEXUS_QA_CLIENT_EMAIL: ${{ secrets.NEXUS_QA_CLIENT_EMAIL }}
      NEXUS_QA_CLIENT_PASSWORD: ${{ secrets.NEXUS_QA_CLIENT_PASSWORD }}
      NEXUS_QA_COMPANY_NAME: ${{ vars.NEXUS_QA_COMPANY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated QA identities
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in NEXUS_QA_ADMIN_EMAIL NEXUS_QA_ADMIN_PASSWORD NEXUS_QA_CLIENT_EMAIL NEXUS_QA_CLIENT_PASSWORD NEXUS_QA_COMPANY_NAME; do
            if [ -z "${!name:-}" ]; then echo "Missing required release-gate configuration: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Authenticated release E2E is blocked until dedicated QA configuration exists."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:roles
