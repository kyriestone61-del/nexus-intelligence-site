name: Nexus Control Room Browser QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Portal base URL'
        required: false
        default: 'https://nexus-intelligence-site.pages.dev'
      full_baseline:
        description: 'Run the full diagnosis-to-completion production workflow'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'portal-production-simplification.js'
      - 'portal-diagnosis-approval-ux.js'
      - 'portal-resolution-plan.js'
      - 'portal-resolution-inline-approval-bridge.js'
      - 'portal-action-processing-engine.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - 'qa/playwright/tests/baseline-workflow.spec.mjs'
      - 'qa/playwright/tests/operational-release-baseline.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'portal-production-simplification.js'
      - 'portal-diagnosis-approval-ux.js'
      - 'portal-resolution-plan.js'
      - 'portal-resolution-inline-approval-bridge.js'
      - 'portal-action-processing-engine.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - 'qa/playwright/tests/baseline-workflow.spec.mjs'
      - 'qa/playwright/tests/operational-release-baseline.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'

permissions:
  contents: read
  id-token: write

jobs:
  cross-browser-control-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: qa/playwright
    env:
      NEXUS_QA_BASE_URL: ${{ github.event.inputs.base_url || 'https://nexus-intelligence-site.pages.dev' }}
      NEXUS_QA_BOOTSTRAP_URL: https://dmdgkjksouhhsuojthav.supabase.co/functions/v1/nexus-calendar-config-check
      NEXUS_QA_FULL_BASELINE: ${{ github.event_name == 'push' && '1' || (github.event.inputs.full_baseline == 'true' && '1' || '0') }}
      NEXUS_QA_BASELINE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[operational-baseline]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Wait for exact deployed portal runtime
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          deployed="$(mktemp)"
          trap 'rm -f "$deployed"' EXIT
          assets=(portal-app.js portal-foundation-hardening.js portal-approval-inbox.js portal-admin-journey.js portal-admin-journey-router.js portal-resolution-plan.js portal-journey-task-guard.js portal-workflow-cohesion.js portal-client-shell-v2.js portal-action-processing-engine.js portal-production-simplification.js portal-ux-refinement.js portal-client-upload-service.js portal-approval-bridge.js portal-action-execution-v2.js)
          for attempt in $(seq 1 60); do
            matched=1
            for asset in "${assets[@]}"; do
              expected="$(sha256sum "../../$asset" | awk '{print $1}')"
              if curl --silent --show-error --fail --max-time 15 --header 'cache-control: no-cache' "$NEXUS_QA_BASE_URL/$asset?qa_sha=${GITHUB_SHA}&attempt=${attempt}" --output "$deployed"; then
                actual="$(sha256sum "$deployed" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then continue; fi
              fi
              echo "Waiting for exact $asset deployment (attempt $attempt)"
              matched=0
              break
            done
            if [ "$matched" = '1' ]; then
              echo "PRODUCTION_PORTAL_ASSET_PARITY=CONFIRMED sha=$GITHUB_SHA assets=${#assets[@]} attempt=$attempt"
              break
            fi
            sleep 5
          done
          if [ "$matched" != '1' ]; then
            echo '::error::Production runtime assets never matched the checked-out build. Refusing authenticated QA against stale code.'
            exit 1
          fi
      - name: Provision disposable authenticated QA identities
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$NEXUS_QA_BOOTSTRAP_URL"
          ready=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"action":"provision"}' "$endpoint" || true)"
            if [ "$code" = '401' ]; then ready=1; break; fi
            echo "Waiting for protected QA bootstrap endpoint (attempt $attempt, HTTP ${code:-curl_error})"
            sleep 3
          done
          if [ "$ready" != '1' ]; then
            echo '::error::The protected Supabase QA bootstrap endpoint is unavailable.'
            exit 1
          fi
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          test -n "$oidc_token" && test "$oidc_token" != 'null'
          oidc_payload="$(printf '%s' "$oidc_token" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d 2>/dev/null)"
          echo 'NEXUS_QA_OIDC_CLAIMS:'
          printf '%s' "$oidc_payload" | jq '{iss,aud,sub,repository,repository_id,repository_owner,repository_owner_id,ref,event_name,workflow_ref,run_id,run_attempt}'
          provision_file="$(mktemp)"
          provision_code="$(curl --silent --show-error --request POST --output "$provision_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"provision"}' "$endpoint" || true)"
          provision="$(cat "$provision_file")"
          if [ "$provision_code" != '200' ]; then
            echo "::error::Disposable QA provisioning failed with HTTP $provision_code."
            printf '%s' "$provision" | jq '{ok,error,stage}' || true
            exit 1
          fi
          printf '%s' "$provision" | jq -e '.ok == true' >/dev/null
          admin_email="$(printf '%s' "$provision" | jq -r '.admin_email')"
          admin_password="$(printf '%s' "$provision" | jq -r '.admin_password')"
          client_email="$(printf '%s' "$provision" | jq -r '.client_email')"
          client_password="$(printf '%s' "$provision" | jq -r '.client_password')"
          company_name="$(printf '%s' "$provision" | jq -r '.company_name')"
          for secret in "$admin_email" "$admin_password" "$client_email" "$client_password"; do echo "::add-mask::$secret"; done
          {
            echo "NEXUS_QA_ADMIN_EMAIL=$admin_email"
            echo "NEXUS_QA_ADMIN_PASSWORD=$admin_password"
            echo "NEXUS_QA_CLIENT_EMAIL=$client_email"
            echo "NEXUS_QA_CLIENT_PASSWORD=$client_password"
            echo "NEXUS_QA_COMPANY_NAME=$company_name"
            echo 'NEXUS_AUTH_QA_READY=1'
          } >> "$GITHUB_ENV"
          echo "AUTHENTICATED_CONTROL_ROOM_QA=EPHEMERAL_READY company=$company_name"
      - name: Report authenticated QA coverage
        shell: bash
        run: |
          if [ "${NEXUS_AUTH_QA_READY:-0}" = '1' ]; then
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=ENABLED_EPHEMERAL'
          elif [ "${GITHUB_EVENT_NAME}" = 'pull_request' ]; then
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=PR_PUBLIC_ONLY'
          else
            echo '::error::Disposable authenticated Nexus QA identities were not provisioned.'
            exit 1
          fi
      - name: Install browser runtime
        run: |
          if [ "${NEXUS_QA_BASELINE_ONLY:-0}" = '1' ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Run production browser paths
        run: |
          if [ "${NEXUS_QA_BASELINE_ONLY:-0}" = '1' ]; then
            echo 'RELYSTRA_OPERATIONAL_BASELINE_ONLY=1'
            npx playwright test tests/operational-release-baseline.spec.mjs --config=control-room.config.mjs --project=desktop-chrome --retries=0
          else
            npx playwright test --config=control-room.config.mjs
          fi
      - name: Enforce authenticated coverage for production
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "${NEXUS_AUTH_QA_READY:-0}" != '1' ]; then
            echo '::error::Production Control Room QA did not run with disposable authenticated admin/client identities.'
            exit 1
          fi
          echo 'AUTHENTICATED_CONTROL_ROOM_QA=REQUIRED_AND_PASSED'
      - name: Report disposable browser failure context
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYQA'
          from pathlib import Path
          for path in sorted(Path('test-results').glob('*/error-context.md')):
              print(f'QA_ERROR_CONTEXT={path.parent.name}')
              print(path.read_text()[:18000])
          PYQA
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nexus-control-room-browser-report
          path: qa/playwright/control-room-report
          if-no-files-found: ignore
      - name: Delete disposable QA identities and company
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$NEXUS_QA_BOOTSTRAP_URL"
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          cleanup_file="$(mktemp)"
          cleanup_code="$(curl --silent --show-error --request POST --output "$cleanup_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"cleanup"}' "$endpoint" || true)"
          cleanup="$(cat "$cleanup_file")"
          if [ "$cleanup_code" != '200' ]; then
            echo "::error::Disposable QA cleanup failed with HTTP $cleanup_code."
            printf '%s' "$cleanup" | jq '{ok,error,stage}' || true
            exit 1
          fi
          printf '%s' "$cleanup" | jq -e '.ok == true' >/dev/null
          echo 'DISPOSABLE_NEXUS_QA_IDENTITIES=CLEANED'