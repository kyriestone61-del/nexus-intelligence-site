name: Nexus Control Room Browser QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Portal base URL'
        required: false
        default: 'https://nexus-intelligence-site.pages.dev'
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'portal-production-simplification.js'
      - 'functions/api/qa-bootstrap.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'portal-production-simplification.js'
      - 'functions/api/qa-bootstrap.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'

permissions:
  contents: read
  id-token: write

jobs:
  cross-browser-control-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: qa/playwright
    env:
      NEXUS_QA_BASE_URL: ${{ github.event.inputs.base_url || 'https://nexus-intelligence-site.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate QA bootstrap source
        shell: bash
        run: node --input-type=module --check < ../../functions/api/qa-bootstrap.js
      - run: npm install --no-audit --no-fund
      - name: Provision disposable authenticated QA identities
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${NEXUS_QA_BASE_URL%/}/api/qa-bootstrap"
          ready=0
          for attempt in $(seq 1 24); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"action":"provision"}' "$endpoint" || true)"
            if [ "$code" = '401' ]; then ready=1; break; fi
            echo "Waiting for QA bootstrap deployment (attempt $attempt, HTTP ${code:-curl_error})"
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo '::error::The GitHub OIDC QA bootstrap endpoint did not become ready.'
            exit 1
          fi
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          test -n "$oidc_token" && test "$oidc_token" != 'null'
          oidc_payload="$(printf '%s' "$oidc_token" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d 2>/dev/null)"
          echo 'NEXUS_QA_OIDC_CLAIMS:'
          printf '%s' "$oidc_payload" | jq '{iss,aud,sub,repository,repository_id,repository_owner,repository_owner_id,ref,event_name,workflow_ref,run_id,run_attempt}'
          provision_file="$(mktemp)"
          provision_code="$(curl --silent --show-error --request POST --output "$provision_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"provision"}' "$endpoint" || true)"
          provision="$(cat "$provision_file")"
          if [ "$provision_code" != '200' ]; then
            echo "::error::Disposable QA provisioning failed with HTTP $provision_code."
            printf '%s' "$provision" | jq '{ok,error,stage,upstream_status}' || true
            exit 1
          fi
          printf '%s' "$provision" | jq -e '.ok == true' >/dev/null
          admin_email="$(printf '%s' "$provision" | jq -r '.admin_email')"
          admin_password="$(printf '%s' "$provision" | jq -r '.admin_password')"
          client_email="$(printf '%s' "$provision" | jq -r '.client_email')"
          client_password="$(printf '%s' "$provision" | jq -r '.client_password')"
          company_name="$(printf '%s' "$provision" | jq -r '.company_name')"
          for secret in "$admin_email" "$admin_password" "$client_email" "$client_password"; do echo "::add-mask::$secret"; done
          {
            echo "NEXUS_QA_ADMIN_EMAIL=$admin_email"
            echo "NEXUS_QA_ADMIN_PASSWORD=$admin_password"
            echo "NEXUS_QA_CLIENT_EMAIL=$client_email"
            echo "NEXUS_QA_CLIENT_PASSWORD=$client_password"
            echo "NEXUS_QA_COMPANY_NAME=$company_name"
            echo 'NEXUS_AUTH_QA_READY=1'
          } >> "$GITHUB_ENV"
          echo "AUTHENTICATED_CONTROL_ROOM_QA=EPHEMERAL_READY company=$company_name"
      - name: Report authenticated QA coverage
        shell: bash
        run: |
          if [ "${NEXUS_AUTH_QA_READY:-0}" = '1' ]; then
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=ENABLED_EPHEMERAL'
          elif [ "${GITHUB_EVENT_NAME}" = 'pull_request' ]; then
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=PR_PUBLIC_ONLY'
          else
            echo '::error::Disposable authenticated Nexus QA identities were not provisioned.'
            exit 1
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Run desktop Chrome, Android Chrome, and iOS WebKit paths
        run: npx playwright test --config=control-room.config.mjs
      - name: Enforce authenticated coverage for production
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "${NEXUS_AUTH_QA_READY:-0}" != '1' ]; then
            echo '::error::Production Control Room QA did not run with disposable authenticated admin/client identities.'
            exit 1
          fi
          echo 'AUTHENTICATED_CONTROL_ROOM_QA=REQUIRED_AND_PASSED'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nexus-control-room-browser-report
          path: qa/playwright/control-room-report
          if-no-files-found: ignore
      - name: Delete disposable QA identities and company
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${NEXUS_QA_BASE_URL%/}/api/qa-bootstrap"
          oidc_json="$(curl --silent --show-error --fail --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-qa")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          cleanup_file="$(mktemp)"
          cleanup_code="$(curl --silent --show-error --request POST --output "$cleanup_file" --write-out '%{http_code}' --header "Authorization: Bearer ${oidc_token}" --header 'content-type: application/json' --data '{"action":"cleanup"}' "$endpoint" || true)"
          cleanup="$(cat "$cleanup_file")"
          if [ "$cleanup_code" != '200' ]; then
            echo "::error::Disposable QA cleanup failed with HTTP $cleanup_code."
            printf '%s' "$cleanup" | jq '{ok,error,stage,upstream_status}' || true
            exit 1
          fi
          printf '%s' "$cleanup" | jq -e '.ok == true' >/dev/null
          echo 'DISPOSABLE_NEXUS_QA_IDENTITIES=CLEANED'
