name: Nexus Control Room Browser QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Portal base URL'
        required: false
        default: 'https://nexus-intelligence-site.pages.dev'
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'
  pull_request:
    paths:
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-client.js'
      - 'portal-auth.js'
      - 'portal-runtime-core.js'
      - 'portal-runtime-hardening.css'
      - 'portal-accessibility.js'
      - 'portal-client-core.js'
      - 'portal-client-upload-service.js'
      - 'portal-client-shell-v2.js'
      - 'portal-client-shell-v2.css'
      - 'portal-client-shell-simple.css'
      - 'portal-perspective-switcher.js'
      - 'portal-approval-inbox.js'
      - 'qa/playwright/control-room.config.mjs'
      - 'qa/playwright/tests/control-room-reconcile.spec.mjs'
      - '.github/workflows/control-room-browser-qa.yml'

permissions:
  contents: read

jobs:
  cross-browser-control-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: qa/playwright
    env:
      NEXUS_QA_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || github.event.inputs.base_url || 'https://nexus-intelligence-site.pages.dev' }}
      NEXUS_QA_ADMIN_EMAIL: ${{ secrets.NEXUS_QA_ADMIN_EMAIL }}
      NEXUS_QA_ADMIN_PASSWORD: ${{ secrets.NEXUS_QA_ADMIN_PASSWORD }}
      NEXUS_QA_CLIENT_EMAIL: ${{ secrets.NEXUS_QA_CLIENT_EMAIL }}
      NEXUS_QA_CLIENT_PASSWORD: ${{ secrets.NEXUS_QA_CLIENT_PASSWORD }}
      NEXUS_QA_COMPANY_NAME: ${{ vars.NEXUS_QA_COMPANY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Start checked-out portal for pull request QA
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          cat >/tmp/nexus_pr_server.py <<'PY'
          import os
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from urllib.parse import urlsplit

          os.chdir(os.environ['GITHUB_WORKSPACE'])

          class NexusHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  parsed=urlsplit(self.path)
                  if parsed.path in ('/portal','/portal/'):
                      self.path='/portal.html'+(('?'+parsed.query) if parsed.query else '')
                  return super().do_GET()

          ThreadingHTTPServer(('127.0.0.1',4173),NexusHandler).serve_forever()
          PY
          python3 /tmp/nexus_pr_server.py >/tmp/nexus-pr-portal.log 2>&1 &
          echo $! >/tmp/nexus-pr-portal.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/portal >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexus-pr-portal.log || true
          exit 1
      - name: Report authenticated QA coverage
        shell: bash
        run: |
          if [ -n "${NEXUS_QA_ADMIN_EMAIL:-}" ] && [ -n "${NEXUS_QA_ADMIN_PASSWORD:-}" ] && [ -n "${NEXUS_QA_CLIENT_EMAIL:-}" ] && [ -n "${NEXUS_QA_CLIENT_PASSWORD:-}" ]; then
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=ENABLED'
            echo 'NEXUS_AUTH_QA_READY=1' >> "$GITHUB_ENV"
          else
            echo '::warning::Dedicated Nexus QA credentials are not configured. Authenticated cases will be skipped, and production-branch QA will be marked incomplete.'
            echo 'AUTHENTICATED_CONTROL_ROOM_QA=NOT_CONFIGURED'
            echo 'NEXUS_AUTH_QA_READY=0' >> "$GITHUB_ENV"
          fi
      - name: Run desktop Chrome, Android Chrome, and iOS WebKit paths
        run: npx playwright test --config=control-room.config.mjs
      - name: Enforce authenticated coverage for production
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "${NEXUS_AUTH_QA_READY:-0}" != '1' ]; then
            echo '::error::Production Control Room QA is incomplete. Configure dedicated NEXUS_QA_ADMIN_* and NEXUS_QA_CLIENT_* GitHub Actions secrets; do not use a personal production password.'
            exit 1
          fi
          echo 'AUTHENTICATED_CONTROL_ROOM_QA=REQUIRED_AND_PASSED'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nexus-control-room-browser-report
          path: qa/playwright/control-room-report
          if-no-files-found: ignore
