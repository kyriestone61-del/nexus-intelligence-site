name: Nexus Service Detail QA

on:
  pull_request:
    paths:
      - 'services/**'
      - 'services.html'
      - 'service-route.js'
      - '_redirects'
      - 'app.js'
      - '.github/workflows/service-detail-qa.yml'

permissions:
  contents: read

jobs:
  service-detail-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current service routes and private report transport
        run: node --test qa/contracts/commercial-public.test.mjs
