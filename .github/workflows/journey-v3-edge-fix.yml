name: Journey V3 Edge Fix

on:
  push:
    branches: [improve/smb-customer-journey-v3]
    paths:
      - '.github/workflows/journey-v3-edge-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/smb-customer-journey-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply edge-case repair
        run: python scripts/journey_v3_edge_fix.py
      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -q "!j.quickScan?.completedAt&&!j.assessment?.completedAt" app.js
          grep -q "observer.observe(root,{childList:true,subtree:true})" app.js
          grep -q "a.href='/book'" app.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/journey_v3_edge_fix.py .github/workflows/journey-v3-edge-fix.yml
          git add app.js
          git commit -m 'Make Snapshot to Fit Call handoff event-driven'
          git push origin HEAD:improve/smb-customer-journey-v3
