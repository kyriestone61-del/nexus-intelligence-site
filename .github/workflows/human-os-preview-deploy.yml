name: Human OS Preview Deploy

on:
  pull_request:
    paths:
      - 'human-os-static/**'
      - '.github/workflows/human-os-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is not configured'; exit 1; }
      - name: Link Human OS Vercel project
        run: |
          mkdir -p human-os-static/.vercel
          cat > human-os-static/.vercel/project.json <<'JSON'
          {"orgId":"team_WLlQMnubiRGw1kzazsHcKGfv","projectId":"prj_5aLXelAQIutHyVALuf9XlRFdD8fG"}
          JSON
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          URL=$(vercel deploy --cwd human-os-static --yes --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$URL" > human-os-preview-url.txt
          echo "Preview: $URL"
      - name: Smoke preview
        run: |
          URL='${{ steps.deploy.outputs.url }}'
          curl -fsSL "$URL/" | grep -q 'Become more capable'
          curl -fsSL "$URL/" | grep -q '\$29/month'
          curl -fsSL "$URL/robots.txt" | grep -q 'Sitemap:'
          curl -fsSL "$URL/sitemap.xml" | grep -q '<urlset'
          curl -fsSL "$URL/privacy" | grep -q 'Human OS Privacy'
          curl -fsSL "$URL/terms" | grep -q 'Human OS Terms'
      - uses: actions/upload-artifact@v4
        with:
          name: human-os-preview-url-${{ github.sha }}
          path: human-os-preview-url.txt
          retention-days: 14
