name: Nexus Founder Diagnosis Report Editor QAQC

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-diagnosis-report-editor.js'
      - 'tests/diagnosis-report-editor-qaqc.mjs'
      - '.github/workflows/diagnosis-report-editor-qaqc.yml'
  push:
    branches: [main]
    paths:
      - 'portal-app.js'
      - 'portal-diagnosis-report-editor.js'
      - 'tests/diagnosis-report-editor-qaqc.mjs'
      - '.github/workflows/diagnosis-report-editor-qaqc.yml'

permissions:
  contents: read

jobs:
  founder-diagnosis-report-editor-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-diagnosis-report-editor.js
      - name: Founder report editor contract
        run: node tests/diagnosis-report-editor-qaqc.mjs
      - name: No privileged browser credentials
        run: |
          set -euo pipefail
          if grep -niE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY|TWILIO_AUTH_TOKEN' portal-diagnosis-report-editor.js; then
            echo 'Privileged credential reference found in founder diagnosis editor.' >&2
            exit 1
          fi
