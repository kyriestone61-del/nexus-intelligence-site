name: Nexus Final Layout Boot QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - '.github/workflows/portal-boot-final-layout-qa.yml'

permissions:
  contents: read

jobs:
  final-layout-boot-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-app.js
      - name: Boot lock contract
        run: |
          set -euo pipefail
          grep -Fq 'window.__nexusPortalBooting=true' portal-app.js
          grep -Fq 'nexusPortalBootOverlay' portal-app.js
          grep -Fq 'Loading Nexus workspace' portal-app.js
          grep -Fq 'portal-client.js?v=${BUILD}' portal-app.js
          grep -Fq 'importWithoutRecurringIntervals' portal-app.js
          grep -Fq '[180]' portal-app.js
          grep -Fq 'window.__nexusOpsInit=false' portal-app.js
          grep -Fq 'labels.includes('\''Client Journey'\'')' portal-app.js
          grep -Fq 'labels.includes('\''Discovery & Diagnosis'\'')' portal-app.js
          grep -Fq 'Final Nexus admin navigation did not initialize.' portal-app.js
          grep -Fq 'clearBootLock();' portal-app.js
      - name: No premature reveal regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('portal-app.js').read_text()
          assert s.index('window.__nexusPortalBooting=true') < s.index('portal-client.js?v=${BUILD}')
          assert s.index("labels.includes('Client Journey')") < s.rindex('clearBootLock();')
          assert s.index("labels.includes('Discovery & Diagnosis')") < s.rindex('clearBootLock();')
          assert 'revealPortal();' not in s
          print('Final-layout boot ordering is deterministic.')
          PY
