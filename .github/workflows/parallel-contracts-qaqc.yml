name: Nexus Parallel Contract QA

on:
  pull_request:
    paths:
      - 'qa/contracts/**'
      - 'qa/database/**'
      - 'qa/relystra-delivery-lifecycle.test.mjs'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'portal-*.js'
      - 'portal-discovery-capture.js'
      - 'portal-app.js'
      - 'portal-production-simplification.js'
      - 'portal-production-simplification.css'
      - '_redirects'
      - '.github/workflows/parallel-contracts-qaqc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check qa/contracts/journey-state.mjs
          node --check qa/contracts/visibility.mjs
          node --check qa/contracts/journey-state.test.mjs
          node --input-type=module --check < portal-discovery-capture.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-production-simplification.js
      - name: Canonical journey and visibility contracts
        run: node --test qa/contracts/*.test.mjs qa/relystra-delivery-lifecycle.test.mjs
      - name: Install pinned local database test dependencies
        run: npm ci --prefix qa/database --ignore-scripts
      - name: Paid delivery database and payment boundary tests
        run: node --test qa/database/*.test.mjs
