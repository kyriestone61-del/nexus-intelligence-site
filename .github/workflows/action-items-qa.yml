name: Nexus Action Items QA

on:
  pull_request:
    paths:
      - 'portal-action-execution-v2.js'
      - 'portal-action-execution-v2-forms.js'
      - 'portal-action-execution-v2.css'
      - 'portal-action-processing-engine.js'
      - 'portal-action-processing-engine.css'
      - 'portal-client-upload-service.js'
      - 'portal-ux-refinement.js'
      - 'portal-app.js'
      - 'supabase/migrations/20260904_nexus_action_item_processing_engine.sql'
      - '.github/workflows/action-items-qa.yml'

permissions:
  contents: read

jobs:
  action-workflow-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-action-execution-v2.js
          node --input-type=module --check < portal-action-execution-v2-forms.js
          node --input-type=module --check < portal-action-processing-engine.js
          node --input-type=module --check < portal-client-upload-service.js
          node --input-type=module --check < portal-ux-refinement.js
          node --input-type=module --check < portal-app.js
      - name: Delivery methodology assertions
        run: |
          set -euo pipefail
          grep -Fq "['my_work','My Work']" portal-action-execution-v2.js
          grep -Fq "['client_work','Client Work']" portal-action-execution-v2.js
          grep -Fq "['ready_review','Ready for Review']" portal-action-execution-v2.js
          grep -Fq "['completed','Completed']" portal-action-execution-v2.js
          grep -Fq 'nexus_submit_task_for_review' portal-action-execution-v2.js
          grep -Fq 'nexus_request_task_revision' portal-action-execution-v2.js
          grep -Fq 'nexus_approve_task' portal-action-execution-v2.js
          grep -Fq 'nexus_assign_action_package' portal-action-execution-v2.js
          grep -Fq 'nexus_assign_action_template' portal-action-execution-v2.js
          grep -Fq 'dependencyBlocked' portal-action-execution-v2.js
          grep -Fq 'nexus_task_comments' portal-action-execution-v2.js
          grep -Fq 'Submitted to Nexus for review.' portal-action-execution-v2.js
          grep -Fq 'Needs Your Attention' portal-action-execution-v2.js
          grep -Fq 'Workflow packages' portal-action-execution-v2.js
      - name: Action processing engine assertions
        run: |
          set -euo pipefail
          grep -Fq 'Every action. One clear next move.' portal-action-processing-engine.js
          grep -Fq 'data-action-start' portal-action-processing-engine.js
          grep -Fq 'data-action-upload' portal-action-processing-engine.js
          grep -Fq 'data-action-comment' portal-action-processing-engine.js
          grep -Fq 'data-action-help' portal-action-processing-engine.js
          grep -Fq 'data-action-submit' portal-action-processing-engine.js
          grep -Fq 'Convert to project' portal-action-processing-engine.js
          grep -Fq 'Archive' portal-action-processing-engine.js
          grep -Fq 'Edit workflow' portal-action-processing-engine.js
          grep -Fq 'nexus_task_events' portal-action-processing-engine.js
          grep -Fq 'nexus_start_task' portal-action-processing-engine.js
          grep -Fq 'nexus_request_task_help' portal-action-processing-engine.js
          grep -Fq 'nexus_admin_task_action' portal-action-processing-engine.js
          grep -Fq 'required_evidence' supabase/migrations/20260904_nexus_action_item_processing_engine.sql
          grep -Fq 'completion_criteria' supabase/migrations/20260904_nexus_action_item_processing_engine.sql
          grep -Fq 'create table if not exists public.nexus_task_events' supabase/migrations/20260904_nexus_action_item_processing_engine.sql
          grep -Fq 'enable row level security' supabase/migrations/20260904_nexus_action_item_processing_engine.sql
          grep -Fq 'nexus members view task events' supabase/migrations/20260904_nexus_action_item_processing_engine.sql
          grep -Fq 'NexusActionProcessingEngine' portal-client-upload-service.js
          grep -Fq 'portal-action-processing-engine.js' portal-client-upload-service.js
          grep -Fq 'portal-action-processing-engine.js' portal-ux-refinement.js
      - name: Client simplicity, structured input, and security assertions
        run: |
          set -euo pipefail
          grep -Fq 'Never share passwords or secrets here.' portal-action-execution-v2.js
          grep -Fq 'Open secure upload' portal-action-execution-v2.js
          grep -Fq 'Request revision' portal-action-execution-v2.js
          grep -Fq 'Approve & complete' portal-action-execution-v2.js
          grep -Fq 'Submit uploaded item for review' portal-action-execution-v2-forms.js
          grep -Fq 'data-v2-field' portal-action-execution-v2-forms.js
          grep -Fq 'Address ${remaining.length} remaining checklist item' portal-action-execution-v2-forms.js
          grep -Fq 'nexus_submit_task_for_review' portal-action-execution-v2-forms.js
          grep -Fq 'portal-action-execution-v2.css' portal-app.js
          grep -Fq 'portal-action-execution-v2.js' portal-app.js
          grep -Fq 'portal-action-execution-v2-forms.js' portal-app.js
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY' portal-action-execution-v2.js portal-action-execution-v2-forms.js portal-action-processing-engine.js portal-action-processing-engine.css; then
            echo 'Privileged credential reference found in browser-delivered action workflow.' >&2
            exit 1
          fi
      - name: Responsive UI assertions
        run: |
          set -euo pipefail
          grep -Fq '@media(max-width:760px)' portal-action-execution-v2.css
          grep -Fq '.action-view-tabs' portal-action-execution-v2.css
          grep -Fq '.package-grid' portal-action-execution-v2.css
          grep -Fq '.dependency-note' portal-action-execution-v2.css
          grep -Fq '@media(max-width:760px)' portal-action-processing-engine.css
          grep -Fq '.action-engine-tabs' portal-action-processing-engine.css
          grep -Fq '.action-engine-actions' portal-action-processing-engine.css
