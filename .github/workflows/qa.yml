name: Nexus QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-client.js
          node --input-type=module --check < portal-client-core.js
          node --input-type=module --check < portal-client-shell.js
          node --input-type=module --check < portal-ops.js
          node --input-type=module --check < portal-auth.js
          node --input-type=module --check < portal-simplify.js
          node --input-type=module --check < portal-admin-intake.js
          node --input-type=module --check < portal-discovery-capture.js
          node --input-type=module --check < portal-action-workflow.js
          node --input-type=module --check < operations.js
          node --input-type=module --check < functions/api/opportunity-snapshot.js
          node --input-type=module --check < functions/api/email-status.js
          node --input-type=module --check < functions/api/email-dispatch.js
          node tests/client-shell-refactor-qaqc.mjs
      - name: Founder console safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nexus_is_platform_admin' operations.js
          grep -q 'approved_external_action' operations.js
          grep -q 'Blocked in foundation release' operations.js
          grep -q 'Do not mark a gate passed from architecture alone' operations.js
          grep -q 'business_completed' operations.js
          grep -q 'robots" content="noindex,nofollow' operations.html
          grep -q '^/operations\*' _headers
          grep -q 'Cache-Control: no-store, max-age=0' _headers
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY' operations.js operations.html operations.css; then
            echo 'Potential privileged secret reference found in founder console files.' >&2
            exit 1
          fi
      - name: Client shell and portal runtime safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'portal-client.js' portal-app.js
          grep -q 'portal-client-core.js' portal-app.js
          grep -q 'portal-client-shell.js' portal-app.js
          grep -q 'portal-client-shell.css' portal-app.js
          grep -q 'window.__nexusOpsInit=true' portal-app.js
          grep -q 'const platformAdmin=!!portal.state?.admin' portal-app.js
          grep -q "portal.state?.viewMode==='client'" portal-app.js
          grep -q 'const useAdminShell=isSignedIn&&platformAdmin&&!useClientShell' portal-app.js
          grep -q 'portal-admin-intake.js' portal-app.js
          grep -q 'portal-action-workflow.js' portal-app.js
          grep -q 'portal-vnext-experience.js' portal-app.js
          grep -q 'NativeMutationObserver' portal-app.js
          grep -q 'NexusPortalNoopObserver' portal-app.js
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('portal-app.js','utf8');
          const perspective=app.indexOf('await perspectiveModule.preparePerspective?.(portal)');
          const decision=app.indexOf("const useClientShell=isSignedIn&&(!platformAdmin||portal.state?.viewMode==='client')");
          if(perspective<0||decision<0||perspective>decision) throw new Error('Perspective must resolve before runtime selection.');
          const match=app.match(/if\(useClientShell\)\{([\s\S]*?)\}\s*else if\(useAdminShell\)/);
          if(!match) throw new Error('Dedicated consolidated client runtime branch not found.');
          const client=match[1];
          const required=['portal-client-shell.css','portal-client-core.js','portal-client-shell.js'];
          for(const file of required) if(!client.includes(file)) throw new Error(`Client runtime missing ${file}`);
          if(!client.includes('mountPerspectiveSwitcher')) throw new Error('Administrator Client View must retain the perspective switcher.');
          const forbidden=['portal-simplify.js','portal-action-workflow.js','portal-vnext-experience.js','portal-approval-inbox.js','portal-workflow-cohesion.js','portal-buildingblok-cohesion.js','portal-client-guide.js','portal-ux-refinement.js'];
          for(const file of forbidden) if(client.includes(file)) throw new Error(`Legacy client overlay still executes: ${file}`);
          NODE
          grep -q 'Secure Data Room' portal.html
          grep -q 'Build with Nexus' portal-client.js
          grep -q 'nexus_project_data_requirements' portal-client.js
          grep -q 'nexus_data_requirement_catalog' portal-client.js
          grep -q 'createSignedUrl' portal-client.js
          grep -q "source_role:state.admin?'nexus':'client'" portal-client.js
          grep -q 'emailRedirectTo:`${location.origin}/portal`' portal-client.js
          grep -q 'initAuthUX' portal-client.js
          grep -q 'Email delivery provider connection pending' portal-client.js
          grep -q 'evaluateClientActionState' portal-client-core.js
          grep -q 'getWorkspaceCurrentActionContext' portal-client-core.js
          grep -q 'aggregateNotifications' portal-client-core.js
          grep -q 'serializeReleasedClientReport' portal-client-core.js
          grep -q 'YOUR NEXT STEP' portal-client-shell.js
          grep -q 'Complete this step →' portal-client-shell.js
          grep -q 'UP NEXT —' portal-client-shell.js
          grep -q 'Needs action' portal-client-shell.js
          grep -q 'Updates' portal-client-shell.js
          grep -q 'Available after Nexus completes' portal-client-shell.js
          if grep -q 'new MutationObserver' portal-client-shell.js; then
            echo 'Consolidated client shell must not use DOM mutation rewrite loops.' >&2
            exit 1
          fi
          grep -q 'event.shiftKey && document.activeElement === first' portal-client-shell.js
          grep -q "event.key === 'Escape'" portal-client-shell.js
          grep -q 'restoreLastFocus' portal-client-shell.js
          grep -q 'min-height:44px' portal-client-shell.css
          grep -q 'env(safe-area-inset-bottom)' portal-client-shell.css
          grep -q 'overflow-x:hidden' portal-client-shell.css
          grep -q 'NEXUS ADMIN ACCOUNT' portal-admin-intake.js
          grep -q 'CLIENT ACCOUNT' portal-admin-intake.js
          grep -q 'nexus_diagnosis_runs' portal-admin-intake.js
          grep -q 'Client Diagnosis Agent' portal-admin-intake.js
          grep -q 'shadow / draft-only' portal-admin-intake.js
          grep -qi 'Capture discovery context' portal-admin-intake.js
          grep -q 'discovery_context_captured' portal-admin-intake.js
          grep -q "DISCOVERY_CAPTURE_STATUS='draft'" portal-discovery-capture.js
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|RESEND_API_KEY|EMAIL_DISPATCH_SECRET' portal-app.js portal-client.js portal-client-core.js portal-client-shell.js portal.html portal-client-shell.css portal-auth.js portal-ops.js portal-admin-intake.js portal-admin-intake.css portal-discovery-capture.js portal-discovery-capture.css portal-action-workflow.js portal-action-workflow.css; then
            echo 'Privileged server credential reference found in browser-delivered portal files.' >&2
            exit 1
          fi
      - name: Operational admin action assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'preparation_checklist' portal-action-workflow.js
          grep -Fq 'workflow_evidence' portal-action-workflow.js
          grep -Fq 'form_schema' portal-action-workflow.js
          grep -Fq 'embedded-checklist' portal-action-workflow.js
          grep -Fq 'nexus_assign_action_template' portal-action-workflow.js
          grep -Fq 'nexus_action_templates' portal-action-workflow.js
          grep -Fq 'nexus_diagnosis_request_drafts' portal-action-workflow.js
          grep -Fq 'nexus_send_diagnosis_request_draft' portal-action-workflow.js
          grep -Fq 'Nexus has been notified' portal-action-workflow.js
          grep -Fq 'Save the required action responses before marking this complete.' portal-action-workflow.js
          grep -Fq 'Address ${remaining.length} remaining checklist item' portal-action-workflow.js
          grep -Fq 'setInterval(()=>reconcile(false).catch(console.error),1200);' portal-action-workflow.js
          if grep -Fq 'new MutationObserver' portal-action-workflow.js; then
            echo 'Operational action workflow must not use a self-observing DOM mutation loop.' >&2
            exit 1
          fi
      - name: SMB customer journey assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "href:'/book',label:'Request My Fit Call'" app.js
          grep -q "!j.quickScan?.completedAt&&!j.assessment?.completedAt" app.js
          grep -q "shareUrl(target='/book')" app.js
          grep -q 'injectSimpleCustomerJourney' app.js
          grep -q 'Free AI Snapshot' app.js
          grep -q 'Paid Opportunity Assessment' app.js
          grep -q 'simplifyQuickScanHandoff' app.js
          grep -q "observer.observe(root,{childList:true,subtree:true})" app.js
          grep -q 'simplifyFitCallExperience' app.js
          grep -q 'Request a Nexus Fit Call' app.js
          grep -q 'appointment-based beauty business' industries.html
          if grep -qi 'Moon Wax' industries.html; then
            echo 'Client-adjacent Moon Wax reference must not appear on the public industries page.' >&2
            exit 1
          fi
          grep -q 'The Nexus Client Portal is an authenticated business workspace' security.html
      - name: Email dispatcher assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' functions/api/email-dispatch.js
          grep -q 'RESEND_API_KEY' functions/api/email-dispatch.js
          grep -q 'EMAIL_DISPATCH_SECRET' functions/api/email-dispatch.js
          grep -q 'nexus_claim_email_batch' functions/api/email-dispatch.js
          grep -q 'nexus_queue_action_digests' functions/api/email-dispatch.js
          grep -q 'Transactional email delivery is not configured' functions/api/email-dispatch.js
      - name: Snapshot funnel safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/opportunity-snapshot' quick-scan.html
          grep -q 'sms_opt_in' quick-scan.html
          grep -q 'submit_nexus_opportunity_snapshot' functions/api/opportunity-snapshot.js