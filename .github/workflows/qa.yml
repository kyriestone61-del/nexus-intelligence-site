name: Nexus QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-client.js
          node --input-type=module --check < portal-ops.js
          node --input-type=module --check < portal-auth.js
          node --input-type=module --check < operations.js
          node --input-type=module --check < functions/api/opportunity-snapshot.js
          node --input-type=module --check < functions/api/email-status.js
          node --input-type=module --check < functions/api/email-dispatch.js
      - name: Founder console safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nexus_is_platform_admin' operations.js
          grep -q 'approved_external_action' operations.js
          grep -q 'Blocked in foundation release' operations.js
          grep -q 'Do not mark a gate passed from architecture alone' operations.js
          grep -q 'business_completed' operations.js
          grep -q 'robots" content="noindex,nofollow' operations.html
          grep -q '^/operations\*' _headers
          grep -q 'Cache-Control: no-store, max-age=0' _headers
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY' operations.js operations.html operations.css; then
            echo 'Potential privileged secret reference found in founder console files.' >&2
            exit 1
          fi
      - name: Portal data-room safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import '/portal-client.js'" portal-app.js
          grep -q 'Secure Data Room' portal.html
          grep -q 'Build with Nexus' portal-client.js
          grep -q 'nexus_project_data_requirements' portal-client.js
          grep -q 'nexus_data_requirement_catalog' portal-client.js
          grep -q 'createSignedUrl' portal-client.js
          grep -q "source_role:state.admin?'nexus':'client'" portal-client.js
          grep -q 'emailRedirectTo:`${location.origin}/portal`' portal-client.js
          grep -q 'initAuthUX' portal-client.js
          grep -q 'initOps' portal-client.js
          grep -q 'Email delivery provider connection pending' portal-client.js
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|RESEND_API_KEY|EMAIL_DISPATCH_SECRET' portal-app.js portal-client.js portal.html portal-v2.css portal-auth.js portal-ops.js; then
            echo 'Privileged server credential reference found in browser-delivered portal files.' >&2
            exit 1
          fi
      - name: Email dispatcher assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' functions/api/email-dispatch.js
          grep -q 'RESEND_API_KEY' functions/api/email-dispatch.js
          grep -q 'EMAIL_DISPATCH_SECRET' functions/api/email-dispatch.js
          grep -q 'nexus_claim_email_batch' functions/api/email-dispatch.js
          grep -q 'nexus_queue_action_digests' functions/api/email-dispatch.js
          grep -q 'Transactional email delivery is not configured' functions/api/email-dispatch.js
      - name: Snapshot funnel safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/opportunity-snapshot' quick-scan.html
          grep -q 'sms_opt_in' quick-scan.html
          grep -q 'submit_nexus_opportunity_snapshot' functions/api/opportunity-snapshot.js
