name: Nexus vNext Diagnosis Experience QA

on:
  pull_request:
    paths:
      - 'portal-app.js'
      - 'portal-admin-intake.js'
      - 'portal-admin-intake.css'
      - 'portal-discovery-capture.js'
      - 'portal-diagnosis-controller-v2.js'
      - 'portal-vnext-experience.js'
      - 'portal-vnext-experience.css'
      - 'supabase/functions/nexus-diagnosis-execute/**'
      - 'supabase/functions/nexus-diagnosis-report-pdf/**'
      - 'supabase/functions/nexus-sms-worker/**'
      - 'supabase/migrations/20260831_nexus_diagnosis_release_qa_inbox.sql'
      - 'supabase/migrations/20260902_nexus_step2_discovery_diagnosis_redesign.sql'
      - 'qa/contracts/vnext-diagnosis-experience.test.mjs'
      - '.github/workflows/vnext-diagnosis-experience-qa.yml'

permissions:
  contents: read

jobs:
  vnext-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portal module syntax
        run: |
          node --input-type=module --check < portal-vnext-experience.js
          node --input-type=module --check < portal-app.js
          node --input-type=module --check < portal-admin-intake.js
          node --input-type=module --check < portal-discovery-capture.js
          node --input-type=module --check < portal-diagnosis-controller-v2.js
      - name: vNext product and security contract
        shell: bash
        run: |
          set +e
          node qa/contracts/vnext-diagnosis-experience.test.mjs > vnext-contract-output.txt 2>&1
          code=$?
          cat vnext-contract-output.txt
          exit $code
      - name: Preserve vNext contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-contract-diagnostics
          path: vnext-contract-output.txt
          if-no-files-found: error
      - name: Diagnosis schema check
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/nexus-diagnosis-execute/index.ts'
          for key in current_state claims facts client_statements admin_context inferences estimates unknowns evidence process_map bottlenecks root_causes baseline_gaps baseline_measurements opportunity_backlog risks follow_up_questions smallest_safe_pilot recommended_first_intervention nexus_actions client_action_items document_requests decision_items executive_summary; do
            grep -q "$key" "$file"
          done
          grep -q 'Evidence Analyst' "$file"
          grep -q 'Process & Opportunity Analyst' "$file"
          grep -q 'Independent QA / Governance Verifier' "$file"
          grep -q 'Final Diagnosis Composer' "$file"
          grep -q 'operation==="gap_analysis"' "$file"
          grep -q 'imageText' "$file"
      - name: Step 2 UX and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'General Discovery Questions' portal-admin-intake.js
          ! grep -qi 'Diagnosis packet' portal-admin-intake.js
          grep -q 'Analyze Missing Information' portal-admin-intake.js
          grep -q 'Review Missing Information' portal-admin-intake.js
          grep -q 'Run Diagnosis' portal-admin-intake.js
          grep -q 'Approve Diagnosis' portal-admin-intake.js
          grep -q 'nexus_send_discovery_information_request' supabase/migrations/20260902_nexus_step2_discovery_diagnosis_redesign.sql
          grep -q 'drop trigger if exists nexus_document_request_release_chain' supabase/migrations/20260902_nexus_step2_discovery_diagnosis_redesign.sql
          grep -q 'nexus_map_diagnosis_action_templates' supabase/migrations/20260902_nexus_step2_discovery_diagnosis_redesign.sql
      - name: Client privacy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "status='released'" supabase/migrations/20260831_nexus_diagnosis_release_qa_inbox.sql
          grep -q "nexus_is_company_member(company_id)" supabase/migrations/20260831_nexus_diagnosis_release_qa_inbox.sql
          grep -q "Only an approved diagnosis can be released" supabase/migrations/20260831_nexus_diagnosis_release_qa_inbox.sql
          grep -q "sms_enabled boolean NOT NULL DEFAULT false" supabase/migrations/20260831_nexus_diagnosis_release_qa_inbox.sql
