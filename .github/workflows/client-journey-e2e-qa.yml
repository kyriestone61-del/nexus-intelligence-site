name: Nexus Client Journey E2E Contract QA

on:
  pull_request:
    paths:
      - 'portal-admin-journey.js'
      - 'portal-admin-intake.js'
      - 'portal-discovery-capture.js'
      - 'portal-discovery-capture.css'
      - 'portal-diagnosis-controller-v2.js'
      - 'portal-diagnosis-execution-ux.js'
      - 'portal-diagnosis-v2.js'
      - 'portal-diagnosis-manual-fallback.js'
      - 'portal-diagnosis-review-ux.js'
      - 'portal-diagnosis-v2.css'
      - 'portal-action-execution-v2-forms.js'
      - 'portal-journey-task-guard.js'
      - 'portal-journey-qaqc.css'
      - 'portal-app.js'
      - 'functions/portal.js'
      - '.github/workflows/client-journey-e2e-qa.yml'

permissions:
  contents: read

jobs:
  client-journey-contract-qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < portal-admin-journey.js
          node --input-type=module --check < portal-admin-intake.js
          node --input-type=module --check < portal-discovery-capture.js
          node --input-type=module --check < portal-diagnosis-controller-v2.js
          node --input-type=module --check < portal-diagnosis-execution-ux.js
          node --input-type=module --check < portal-diagnosis-v2.js
          node --input-type=module --check < portal-diagnosis-manual-fallback.js
          node --input-type=module --check < portal-diagnosis-review-ux.js
          node --input-type=module --check < portal-action-execution-v2-forms.js
          node --input-type=module --check < portal-journey-task-guard.js
          node --input-type=module --check < portal-app.js
          node --check functions/portal.js
      - name: Transcript-first Step 2 assertions
        run: |
          set -euo pipefail
          grep -Fq "title:'Collect Information'" portal-admin-journey.js
          grep -Fq 'Open Discovery Intake' portal-admin-journey.js
          grep -Fq 'Send Client Checklist (optional)' portal-admin-journey.js
          grep -Fq "['intake','Discovery & Diagnosis']" portal-admin-journey.js
          grep -Fq "section.id='section-intake'" portal-admin-intake.js
          grep -Fq "category==='Discovery Transcript'" portal-diagnosis-controller-v2.js
          grep -Fq 'syncTranscriptSelection' portal-diagnosis-controller-v2.js
          grep -Fq 'resolveTranscriptId' portal-diagnosis-controller-v2.js
          grep -Fq 'Capture discovery context' portal-admin-intake.js
          grep -Fq 'buildDiscoveryCapturePayload' portal-admin-intake.js
          grep -Fq 'nexus:discovery-context-captured' portal-admin-journey.js
      - name: Step 3 diagnosis assertions
        run: |
          set -euo pipefail
          grep -Fq "title:'Diagnose'" portal-admin-journey.js
          grep -Fq 'diagnosisApproved' portal-admin-journey.js
          grep -Fq 'analysis_result' portal-admin-journey.js
          grep -Fq 'diagnosisJourneyButton' portal-diagnosis-controller-v2.js
          grep -Fq 'Resolve Diagnosis Issue' portal-diagnosis-controller-v2.js
          grep -Fq 'Review Diagnosis' portal-diagnosis-controller-v2.js
          grep -Fq "sb.functions.invoke('nexus-diagnosis-execute'" portal-diagnosis-controller-v2.js
          grep -Fq 'existingRunForTranscript' portal-diagnosis-controller-v2.js
          grep -Fq 'ready_for_review' portal-diagnosis-v2.js
          grep -Fq 'Approve diagnosis →' portal-diagnosis-v2.js
          grep -Fq 'nexus_approve_diagnosis' portal-diagnosis-v2.js
          grep -Fq 'Smallest safe pilot' portal-diagnosis-v2.js
          grep -Fq 'Finish Step 3 with ChatGPT' portal-diagnosis-manual-fallback.js
          grep -Fq 'Save diagnosis for review' portal-diagnosis-manual-fallback.js
      - name: Silent-click and failure-feedback assertions
        run: |
          set -euo pipefail
          grep -Fq 'root.onclick=handleJourneyClick' portal-admin-journey.js
          grep -Fq 'journey-inline-notice' portal-admin-journey.js
          grep -Fq 'No action items were created' portal-admin-journey.js
          grep -Fq 'Starting…' portal-admin-journey.js
          grep -Fq 'journey-inline-notice.error' portal-journey-qaqc.css
          grep -Fq 'event.stopImmediatePropagation' portal-diagnosis-controller-v2.js
          grep -Fq 'Diagnosis execution failed.' portal-diagnosis-controller-v2.js
          grep -Fq 'already exists for this transcript' portal-diagnosis-controller-v2.js
      - name: Task dependency and exception assertions
        run: |
          set -euo pipefail
          grep -Fq 'nexus_admin_set_task_status' portal-journey-task-guard.js
          grep -Fq 'dependencyBlocked' portal-journey-task-guard.js
          grep -Fq 'Complete from evidence' portal-journey-task-guard.js
          grep -Fq 'Not applicable' portal-journey-task-guard.js
          grep -Fq "'not_applicable'" portal-action-execution-v2-forms.js
          grep -Fq "'not_applicable'" portal-admin-journey.js
      - name: Stable deployed asset loader assertions
        run: |
          set -euo pipefail
          grep -Fq 'nexus-runtime-booting' portal-app.js
          grep -Fq 'portal-admin-journey.js' portal-app.js
          grep -Fq 'portal-action-execution-v2-forms.js' portal-app.js
          grep -Fq 'portal-journey-task-guard.js' portal-app.js
          grep -Fq 'portal-journey-qaqc.css' portal-app.js
          grep -Fq 'portal-diagnosis-controller-v2.js' portal-app.js
          grep -Fq 'portal-diagnosis-execution-ux.js' portal-app.js
          grep -Fq 'portal-diagnosis-release-queue.js' portal-app.js
          grep -Fq 'portal-diagnosis-v2.js' portal-app.js
          grep -Fq 'portal-diagnosis-v2.css' portal-app.js
          grep -Fq 'portal-diagnosis-manual-fallback.js' portal-app.js
          grep -Fq "const asset=path=>\`/" portal-app.js
          grep -Fq 'exact code packaged in this Cloudflare deployment' functions/portal.js
          if grep -Fq 'portal-diagnosis-override.js' portal-app.js || grep -Fq 'portal-diagnosis-state-labels.js' portal-app.js || grep -Fq 'portal-journey-reliability.js' portal-app.js; then
            echo 'Competing legacy Journey/diagnosis patches must not load.' >&2
            exit 1
          fi
      - name: Browser security assertions
        run: |
          set -euo pipefail
          if grep -RniE 'service[_-]?role|SUPABASE_SERVICE|SECRET_KEY|RESEND_API_KEY|AI_GATEWAY_API_KEY' portal-admin-journey.js portal-admin-intake.js portal-discovery-capture.js portal-diagnosis-controller-v2.js portal-diagnosis-execution-ux.js portal-diagnosis-v2.js portal-diagnosis-manual-fallback.js portal-journey-task-guard.js portal-journey-qaqc.css; then
            echo 'Privileged credential reference found in browser-delivered journey files.' >&2
            exit 1
          fi
