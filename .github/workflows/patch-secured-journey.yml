name: One-time secured journey alignment patch

on:
  push:
    branches:
      - qa/runtime-loading-20260830
    paths:
      - '.github/workflows/patch-secured-journey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/runtime-loading-20260830
          fetch-depth: 0
      - name: Patch admin journey to secured diagnosis lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('portal-admin-journey.js')
          s=p.read_text()
          replacements=[
          ("{n:3,key:'diagnosis',title:'Diagnose',desc:'Run the Client Diagnosis Agent in the current shadow workflow, save the diagnosis output to the client record, review it, and approve it before solution planning.'}",
           "{n:3,key:'diagnosis',title:'Diagnose',desc:'Run secured Client Diagnosis analysis on the authorized evidence, review the structured findings, and approve the diagnosis before solution planning.'}"),
          ("function discoveryPacketReady(){return diagnosisRuns.some(r=>['ready_for_analysis','in_review','approved'].includes(r.status))}",
           "function discoveryPacketReady(){return diagnosisRuns.some(r=>['queued','analyzing','ready_for_review','revision_requested','blocked','failed','approved','ready_for_analysis','in_review'].includes(r.status))}"),
          (""" if(stage.key==='diagnosis'){
   const r=latestDiagnosis();if(!r)return 'not_started';
   if(diagnosisApproved())return 'complete';
   if(diagnosisHasResult(r))return 'review';
   if(r.status==='blocked')return 'in_progress';
   return 'nexus';
 }""",
           """ if(stage.key==='diagnosis'){
   const r=latestDiagnosis();if(!r)return 'not_started';
   if(diagnosisApproved())return 'complete';
   if(r.status==='ready_for_review'&&diagnosisHasResult(r))return 'review';
   if(['queued','analyzing'].includes(r.status))return 'in_progress';
   if(['ready_for_analysis','revision_requested','blocked','failed'].includes(r.status))return 'nexus';
   if(diagnosisHasResult(r))return 'review';
   return 'nexus';
 }"""),
          (""" if(stage.key==='diagnosis'){
   const r=latestDiagnosis();
   if(!diagnosisHasResult(r))return {title:'Run the Client Diagnosis Agent',copy:'Open Discovery & Diagnosis, click Copy agent packet, run that packet in ChatGPT, then paste the completed diagnosis back into Nexus and save it.',label:'Open Diagnosis Review',open:'intake'};
   if(r?.status!=='approved')return {title:'Review and approve the diagnosis',copy:'The diagnosis output is stored. Review it in Discovery & Diagnosis and approve it when the findings, unknowns, baseline gaps, opportunities, and smallest pilot are ready to use.',label:'Review Diagnosis',open:'intake'};
 }""",
           """ if(stage.key==='diagnosis'){
   const r=latestDiagnosis();
   if(!r)return {title:'Start the secured diagnosis',copy:'Open Discovery & Diagnosis, select the authorized transcript and supporting evidence, then queue secured analysis.',label:'Open Discovery & Diagnosis',open:'intake'};
   if(['queued','analyzing'].includes(r.status))return {title:'Secured diagnosis is running',copy:'Nexus is analyzing the authorized evidence. You can open Discovery & Diagnosis to view the current status.',label:'View Diagnosis Status',open:'intake'};
   if(r.status==='ready_for_analysis')return {title:'Run the secured diagnosis',copy:'Your discovery packet is ready. Open Discovery & Diagnosis and run secured analysis on the existing packet.',label:'Run Diagnosis',open:'intake'};
   if(['revision_requested','blocked','failed'].includes(r.status))return {title:'Resolve the diagnosis issue',copy:'Open Discovery & Diagnosis to review the status or review note, address the issue, and retry the secured diagnosis.',label:'Open Diagnosis',open:'intake'};
   if(r.status==='ready_for_review'||diagnosisHasResult(r))return {title:'Review and approve the diagnosis',copy:'Secured analysis is complete. Review the structured findings, unknowns, baseline gaps, opportunities, risks, and smallest safe pilot, then approve when ready.',label:'Review Diagnosis',open:'intake'};
 }"""),
          ("async function init(){if(initialized||!state.admin)return;initialized=true;ensureSection();rebuildAdminNav();await showJourney();$('companySelect')?.addEventListener('change',()=>setTimeout(async()=>{journeyNotice=null;rebuildAdminNav();await showJourney()},650));window.addEventListener('nexus:diagnosis-updated',()=>setTimeout(showJourney,120))}",
           "async function init(){if(initialized||!state.admin)return;initialized=true;ensureSection();rebuildAdminNav();await showJourney();$('companySelect')?.addEventListener('change',()=>setTimeout(async()=>{journeyNotice=null;rebuildAdminNav();await showJourney()},650));const refreshDiagnosisJourney=()=>setTimeout(showJourney,120);window.addEventListener('nexus:diagnosis-changed',refreshDiagnosisJourney);window.addEventListener('nexus:diagnosis-updated',refreshDiagnosisJourney)}")
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              s=s.replace(old,new)
          # Make diagnosis stage metadata match the secured lifecycle without changing layout structure.
          old="meta=diagnosisApproved()?'<span>Diagnosis approved</span>':diagnosisHasResult(r)?'<span>Diagnosis output saved</span>':r?'<span>Ready for analysis</span>':'<span>No diagnosis packet yet</span>'"
          new="meta=diagnosisApproved()?'<span>Diagnosis approved</span>':r?.status==='ready_for_review'?'<span>Ready for review</span>':['queued','analyzing'].includes(r?.status)?'<span>Secured analysis running</span>':['blocked','failed','revision_requested'].includes(r?.status)?'<span>Diagnosis needs attention</span>':r?.status==='ready_for_analysis'?'<span>Ready to run secured analysis</span>':diagnosisHasResult(r)?'<span>Diagnosis output ready</span>':r?'<span>Diagnosis in progress</span>':'<span>No diagnosis packet yet</span>'"
          if s.count(old)!=1:
              raise SystemExit(f'Expected diagnosis metadata match once, found {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node --input-type=module --check < portal-admin-journey.js
          grep -Fq 'Secured diagnosis is running' portal-admin-journey.js
          grep -Fq 'nexus:diagnosis-changed' portal-admin-journey.js
          grep -Fq 'ready_for_review' portal-admin-journey.js
      - name: Commit patch
        run: |
          git config user.name 'Nexus QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add portal-admin-journey.js
          git commit -m 'Align Client Journey with secured diagnosis lifecycle'
          git push origin HEAD:qa/runtime-loading-20260830
