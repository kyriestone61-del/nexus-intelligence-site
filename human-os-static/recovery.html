<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset your password | Human OS</title>
<style>body{margin:0;background:#0b0d10;color:#f3f3ef;font:16px/1.6 system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:28px}a{color:#d6b15f}h1{line-height:1.15}form{display:grid;gap:14px}label{display:grid;gap:6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #4b5158;font:inherit}input{background:#171b20;color:white}button{background:#d6b15f;color:#16120c;cursor:pointer}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}#status{min-height:3em}</style>

<body><main><a href="/">HUMAN OS</a><h1>Choose a new password</h1><p>This changes only your Human OS password.</p><p id="status" role="status" aria-live="polite">Checking your reset link…</p>
